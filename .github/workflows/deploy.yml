name: Deploy

# Publishes the production build to Cloudflare Pages on every push to main.
# Skipped until the repository is set up for it: the variable
# CLOUDFLARE_PAGES_PROJECT (the project's name) and the secrets
# CLOUDFLARE_API_TOKEN (a token with "Cloudflare Pages: Edit") and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  pages:
    if: vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Writes dist/_headers too, so Cloudflare serves the same security headers as `pnpm serve`.
      # Installing and building run dependencies' scripts, so only the steps below see the token.
      - run: pnpm build
      - name: Create the Pages project if it is missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          case "$status" in
            200) echo "Project $PROJECT exists." ;;
            404) pnpm dlx wrangler@4 pages project create "$PROJECT" --production-branch main ;;
            *) echo "Could not look up project $PROJECT: HTTP $status"; exit 1 ;;
          esac
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy apps/web/dist --project-name "$PROJECT" --branch main
