# yaml-language-server: $schema=../../schema/problem.schema.json
id: url-shortener
version: 1
title: URL Shortener
levels: [senior, staff]
brief: |
  Users submit long URLs and get short codes back. Anyone who opens a short
  link is redirected to the long URL. Links can expire, trust & safety can
  disable abusive links, and links to phishing or malware sites must be
  stopped. Traffic is heavily read-biased and link popularity is
  very skewed: a few links get most of the clicks.
scale:
  - { label: Creates, value: "1,000 /s avg, ×3 peak", note: "158 B links over 5 years" }
  - { label: Redirects, value: "100,000 /s avg, ×3 peak", note: "100:1 read/write" }
  - { label: Link record, value: "~500 B", note: "~79 TB raw over 5 years" }
  - { label: Code space, value: "7 chars base62", note: "62⁷ ≈ 3.5 × 10¹² codes" }
requirements:
  - { id: FR-1, kind: functional, text: "Create a short link for a long URL, with an optional custom alias." }
  - { id: FR-2, kind: functional, text: "Redirect a short code to its long URL." }
  - { id: FR-3, kind: functional, text: "Links may expire; an expired link no longer redirects." }
  - { id: FR-4, kind: functional, text: "A disabled (abusive) link stops redirecting within 60 seconds." }
  - { id: FR-5, kind: functional, text: "A link to a known phishing or malware site is rejected, or stops redirecting within 60 seconds of its creation." }
  - { id: NFR-1, kind: non-functional, text: "Redirect p99 < 50 ms server-side; create p99 < 200 ms." }
  - { id: NFR-2, kind: non-functional, text: "Redirect availability 99.99%; create availability 99.9%." }
  - { id: NFR-3, kind: non-functional, text: "Codes are unique and not enumerable." }
  - { id: NFR-4, kind: non-functional, text: "An acknowledged link is never lost." }
  - { id: NFR-5, kind: non-functional, text: "Link creation is protected against abuse with per-client limits." }
  - { id: FR-6, kind: functional, text: "Link owners see how many times each link was clicked, at most a minute behind." }
  - { id: NFR-6, kind: non-functional, text: "Counting clicks never slows down or fails a redirect, and never counts a click twice." }
  - { id: NFR-7, kind: non-functional, text: "Losing the whole region brings redirects back within four minutes and creates within five, losing at most the last second of new links." }
entities:
  - name: Link
    key: code
    fields: [code, longUrl, ownerId, createdAt, expiresAt, status]
    avgBytes: 500
  - name: LinkStats
    key: code
    fields: [code, clicks, updatedAt]
    avgBytes: 64
  - name: Click
    key: clickId
    fields: [clickId, code, at]
    avgBytes: 100
# bytes: one request and its response on the wire, HTTP headers included.
operations:
  - id: create-link
    label: Create link
    method: POST
    path: /links
    bytes: { request: 800, response: 400 }
    class: write
    idempotent: false
    successStatuses: [201, 400, 409]
    requirements: [FR-1, NFR-3, NFR-4, NFR-5]
    introducedIn: s1-create
  - id: redirect
    label: Redirect
    method: GET
    path: "/{code}"
    bytes: { request: 600, response: 300 }
    class: read
    idempotent: true
    successStatuses: [301, 302, 307, 308, 404, 410]
    requirements: [FR-2, FR-3, NFR-1, NFR-2]
    introducedIn: s2-redirect
  - id: disable-link
    label: Disable link
    method: POST
    path: "/links/{code}/disable"
    bytes: { request: 600, response: 200 }
    class: write
    idempotent: true
    successStatuses: [200, 204, 404]
    requirements: [FR-4]
    introducedIn: s4-cache-outage
  - id: purge-expired
    label: Purge expired links
    trigger:
      type: schedule
      description: Runs continuously in the background and deletes links whose expiry has passed.
    class: write
    idempotent: true
    successStatuses: [200]
    requirements: [FR-3]
    introducedIn: s7-edge-cases
  - id: scan-link
    label: Scan new link
    trigger: { type: event, event: link-created }
    class: write
    idempotent: true
    successStatuses: [200]
    requirements: [FR-5]
    introducedIn: s7-edge-cases
  - id: record-click
    label: Record click
    trigger: { type: event, event: link-clicked }
    class: write
    idempotent: false
    successStatuses: [200]
    requirements: [FR-6, NFR-6]
    introducedIn: s8-click-analytics
events:
  - { id: link-created, label: Link created, entity: Link }
  # A click message carries the code and when it was clicked, not the link.
  - { id: link-clicked, label: Link clicked, entity: Link, bytes: 100 }
# Each click comes from a different visitor, so every redirect opens its own
# connection, which stays open until the load balancer's 60-second idle
# timeout closes it.
client: { flavor: browser, label: Visitors, requestsPerConnection: 1, connectionSec: 60 }
logic:
  [checkExpiry, validateUrl, checkStatus, hasCustomAlias, generateRandomCode, hashUrl, rehashWithSalt, encodeBase62, obfuscateId, matchThreatList]
decisionPoints:
  - id: code-strategy
    question: How are short codes generated?
    options:
      - { id: kgs, label: Key generation service (pre-generated random keys) }
      - { id: random-conditional, label: Random code + conditional insert }
      - { id: counter-range, label: Counter ranges + base62 }
      - { id: hash-based, label: Hash of the long URL }
    requirements: [NFR-3]
  - id: code-length
    question: How many characters do generated codes have?
    options:
      - { id: "6", label: 6 characters (62⁶ ≈ 5.7 × 10¹⁰) }
      - { id: "7", label: 7 characters (62⁷ ≈ 3.5 × 10¹²) }
      - { id: "8", label: 8 characters (62⁸ ≈ 2.2 × 10¹⁴) }
    default: "7"
    requirements: [NFR-3]
  - id: redirect-status
    question: Which redirect status do you return?
    options:
      - { id: "301", label: 301 Moved Permanently }
      - { id: "302", label: 302 Found }
      - { id: 301-short-max-age, label: 301 with a short Cache-Control max-age }
      - { id: "307", label: 307 Temporary Redirect }
      - { id: "308", label: 308 Permanent Redirect }
    requirements: [FR-4]
  - id: replication-mode
    question: How does the link store replicate writes?
    options:
      - { id: async, label: Asynchronous }
      - { id: semi-sync, label: Semi-synchronous }
      - { id: sync, label: Synchronous }
    requirements: [NFR-4, NFR-1]
  - id: region-mode
    question: Does the second region take traffic too?
    options:
      - { id: active-passive, label: "Active-passive: it waits for the primary to fail" }
      - { id: active-active, label: "Active-active: both regions serve their nearby users" }
    requirements: [NFR-7, NFR-3]
  - id: expired-status
    question: What does an expired link return?
    options:
      - { id: "404", label: 404 Not Found }
      - { id: "410", label: 410 Gone }
    requirements: [FR-3]
  - id: code-reuse
    question: Can the code of an expired link be given to a new link?
    options:
      - { id: never, label: Never }
      - { id: after-grace, label: After a grace period longer than every cache TTL }
      - { id: immediately, label: As soon as the link expires }
    requirements: [FR-3, NFR-3]
estimates:
  - id: links-per-day
    question: How many links are created on an average day?
    kind: count
    answer: 86400000
    derivation: >-
      1,000 creates a second × 86,400 seconds in a day ≈ 86 million links a
      day.
  - id: links-in-5-years
    question: How many links exist after five years?
    kind: count
    answer: 157680000000
    derivation: >-
      86.4 million a day × 365 days × 5 years ≈ 158 billion links.
  - id: storage-in-5-years
    question: How much storage do five years of links take, before replication?
    kind: bytes
    answer: 78840000000000
    derivation: >-
      158 billion links × 500 bytes ≈ 79 TB. Three copies (a primary and two
      replicas) make about 237 TB.
  - id: peak-redirects
    question: How many redirects a second does the read path take at peak?
    kind: rate
    answer: 300000
    derivation: >-
      100,000 a second on average, three times that at peak: 300,000 a second,
      100 for every create.
  - id: code-space
    question: How many different 7-character codes can you make from letters and digits (base62)?
    kind: count
    answer: 3521614606208
    derivation: >-
      62 choices in each of 7 positions: 62⁷ ≈ 3.5 × 10¹². Five years of links
      fill about 4.5% of it, so random codes rarely collide.
  - id: cache-memory
    question: >-
      Cache entries are about 500 bytes, and a cache can use about 70% of its
      memory for entries. How much memory holds the 20 million most popular
      links?
    kind: bytes
    answer: 14285714286
    derivation: >-
      20 million × 500 bytes = 10 GB of entries; at 70% usable, about 14 GB.
      With this skew, the most popular 20 million links take about 80% of
      redirects.
  - id: clicks-per-day
    question: Every redirect to a live link is a click. How many clicks are there on an average day?
    kind: count
    answer: 8640000000
    derivation: >-
      100,000 a second × 86,400 seconds ≈ 8.6 billion clicks a day, about
      260 billion a month.
  - id: click-bandwidth
    question: A click event is about 200 bytes. How much data reaches the click log every second at peak?
    kind: byte-rate
    answer: 60000000
    derivation: >-
      300,000 clicks a second × 200 bytes = 60 MB/s, before replication: with
      three copies, the brokers write 180 MB/s.
  - id: count-storage
    question: A per-link count takes about 64 bytes. How much space do counts for 20 billion links take?
    kind: bytes
    answer: 1280000000000
    derivation: >-
      20 billion × 64 bytes ≈ 1.3 TB, small next to the links themselves.
scenarios:
  [s1-create, s2-redirect, s3-cache, s4-cache-outage, s5-hot-keys, s6-dependency-failure, s7-edge-cases, s8-click-analytics, s9-region-loss]
