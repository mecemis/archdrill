# Each mutant breaks a golden design in one specific way. CI asserts that the
# evaluator catches it: either validation blocks the scenario with the listed
# issue codes, or the listed checks fail.
mutants:
  - id: reverse-ingress
    base: postgres-redis-cache-aside
    description: The load balancer → redirect service connection points the wrong way.
    apply:
      - reverseConnection: { id: lb--redirect-api }
    expect:
      scenario: s2-redirect
      invalid: [flow-handler-unreachable]

  - id: reverse-cache-connection
    base: postgres-redis-cache-aside
    description: The redirect service → cache connection points the wrong way, so it cannot call the cache.
    apply:
      - reverseConnection: { id: redirect-api--redis }
    expect:
      scenario: s2-redirect
      invalid: [step-no-connection]

  - id: unhandled-not-found
    base: postgres-redis-cache-aside
    description: The store's notFound outcome leads nowhere.
    apply:
      - linkOutcome: { operation: redirect, stepId: read, outcome: notFound, target: null }
    expect:
      scenario: s2-redirect
      fails: [unknown-code-404]
      band: not-passing

  - id: negative-hit-redirects
    base: postgres-redis-cache-aside
    description: A negative cache hit is treated like a hit and redirected.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: negativeHit, target: expiry-hit }
    expect:
      scenario: s2-redirect
      fails: [redirect-backed-by-data, unknown-code-404]
      band: not-passing

  - id: blind-redirect-on-miss
    base: postgres-redis-cache-aside
    description: A cache miss redirects without reading the store.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: miss, target: r302 }
    expect:
      scenario: s2-redirect
      fails: [redirect-backed-by-data]
      band: not-passing

  - id: no-expiry-check-on-hit
    base: postgres-redis-cache-aside
    description: Cache hits redirect without checking expiry.
    apply:
      - removeStep: { operation: redirect, stepId: expiry-hit, bypass: valid }
    expect:
      scenario: s2-redirect
      fails: [expired-not-redirected]
      band: not-passing

  - id: no-populate
    base: postgres-redis-cache-aside
    description: Misses that find the link never write it back to the cache.
    apply:
      - removeStep: { operation: redirect, stepId: populate, bypass: ok }
    expect:
      scenario: s2-redirect
      fails: [cache-warms]

  - id: single-api-replica
    base: postgres-redis-cache-aside
    description: The redirect service runs as a single instance.
    apply:
      - updateComponent: { id: redirect-api, replicas: 1 }
    expect:
      scenario: s2-redirect
      fails: [no-single-point-of-failure]

  - id: cache-error-fails-request-single-node
    base: postgres-redis-fixed-fleet
    description: A cache error fails the request and the cache is a single node.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: error, target: r503 }
      - updateComponent: { id: redis, replicas: 1 }
    expect:
      scenario: s2-redirect
      fails: [no-single-point-of-failure]

  - id: store-error-unhandled
    base: dynamodb-direct
    description: The store's error outcome leads nowhere.
    apply:
      - linkOutcome: { operation: redirect, stepId: read, outcome: error, target: null }
    expect:
      scenario: s2-redirect
      fails: [errors-handled]

  - id: expired-redirects
    base: dynamodb-direct
    description: Expired links are redirected anyway.
    apply:
      - linkOutcome: { operation: redirect, stepId: expiry, outcome: expired, target: r302 }
    expect:
      scenario: s2-redirect
      fails: [expired-not-redirected, expired-answer]
      band: not-passing

  # Load, capacity and cost: caught by the simulation, not by the flow shape.
  - id: api-underprovisioned
    base: postgres-redis-fixed-fleet
    description: Ten redirect service instances for 300,000 redirects a second.
    apply:
      - updateComponent: { id: redirect-api, replicas: 10 }
    expect:
      scenario: s2-redirect
      fails: [serves-peak, no-overload-at-peak, headroom-at-peak, redirect-p99]
      band: not-passing

  - id: tiny-cache
    base: postgres-redis-cache-aside
    description: One small Redis node in front of the store.
    apply:
      - updateComponent: { id: redis, size: s, shards: 1, replicas: 1 }
    expect:
      scenario: s3-cache
      fails: [hit-ratio, serves-peak, no-overload-at-peak]
      band: not-passing

  - id: short-ttl
    base: postgres-redis-fixed-fleet
    description: Cache entries live for 30 seconds; the hit ratio drops and the misses overload the database.
    apply:
      - updateStep: { operation: redirect, stepId: populate, ttlSec: 30 }
    expect:
      scenario: s3-cache
      fails: [hit-ratio, serves-peak]
      band: not-passing

  - id: cache-never-populated
    base: postgres-redis-cache-aside
    description: Misses never write back, so the cache stays empty.
    apply:
      - removeStep: { operation: redirect, stepId: populate, bypass: ok }
    expect:
      scenario: s3-cache
      fails: [cache-warms, hit-ratio]
      band: not-passing

  - id: undersized-database
    base: postgres-redis-fixed-fleet
    description: A single database node takes every cache miss.
    apply:
      - updateComponent: { id: links-db, shards: 1, replicas: 1 }
    expect:
      scenario: s3-cache
      fails: [serves-peak, no-overload-at-peak, headroom-at-peak]
      band: not-passing

  - id: replica-sprawl
    base: postgres-redis-cache-aside
    description: Eight replicas per shard, each storing a full copy of 79 TB.
    apply:
      - updateComponent: { id: links-db, replicas: 8 }
    expect:
      scenario: s3-cache
      fails: [within-budget]
      band: not-passing

  # Write path (S1): uniqueness, durability, collisions and code space.
  - id: put-instead-of-conditional-insert
    base: postgres-redis-cache-aside
    description: The generated code is written with an overwriting put.
    apply:
      - updateStep: { operation: create-link, stepId: insert, action: store.insert }
    expect:
      scenario: s1-create
      fails: [atomic-uniqueness]
      band: not-passing

  - id: check-then-insert
    base: dynamodb-redis-cache-aside
    description: The flow reads the code first and puts it if absent, a TOCTOU race.
    apply:
      - updateStep: { operation: create-link, stepId: insert, action: store.insert }
      - addStep:
          operation: create-link
          id: probe
          step: { type: call, target: links, action: store.read, entity: Link }
          attach: { to: outcome, stepId: generate, outcome: ok }
          continueWith: { outcome: notFound }
    expect:
      scenario: s1-create
      fails: [no-check-then-insert, atomic-uniqueness]
      band: not-passing

  - id: collision-not-retried
    base: dynamodb-redis-cache-aside
    description: A colliding random code fails the request instead of being retried.
    apply:
      - linkOutcome: { operation: create-link, stepId: insert, outcome: conflict, target: c503 }
    expect:
      scenario: s1-create
      fails: [generated-collision-retried]

  - id: collision-answers-409
    base: dynamodb-redis-cache-aside
    description: A collision on a generated code is reported to the user as 409.
    apply:
      - linkOutcome: { operation: create-link, stepId: insert, outcome: conflict, target: c409 }
    expect:
      scenario: s1-create
      fails: [generated-collision-not-409, generated-collision-retried]

  - id: enumerable-codes
    base: mysql-memcached-cache-aside
    description: Leased counter values are encoded without being scrambled.
    apply:
      - removeStep: { operation: create-link, stepId: obfuscate, bypass: ok }
    expect:
      scenario: s1-create
      fails: [non-enumerable]

  - id: ack-before-write
    base: postgres-redis-cache-aside
    description: The service answers 201 as soon as it has a key, before storing the link.
    apply:
      - linkOutcome: { operation: create-link, stepId: allocate, outcome: ok, target: c201 }
    expect:
      scenario: s1-create
      fails: [durable-before-ack, atomic-uniqueness]
      band: not-passing

  - id: no-url-validation
    base: postgres-redis-cache-aside
    description: URLs are stored without validation.
    apply:
      - removeStep: { operation: create-link, stepId: validate, bypass: valid }
    expect:
      scenario: s1-create
      fails: [validates-before-writing]
      band: not-passing

  - id: six-character-codes
    base: dynamodb-direct
    description: Six-character random codes; 158 billion links do not fit in 62⁶ codes.
    apply:
      - setDecision: { decision: code-length, option: "6" }
    expect:
      scenario: s1-create
      fails: [serves-peak, creates-succeed]
      band: not-passing

  - id: seven-characters-one-retry
    base: dynamodb-redis-cache-aside
    description: Seven-character random codes with a single retry fail about 0.2% of creates at 5-year occupancy.
    apply:
      - setDecision: { decision: code-length, option: "7" }
    expect:
      scenario: s1-create
      fails: [creates-succeed]

  - id: decision-contradicts-flow
    base: postgres-redis-cache-aside
    description: The declared strategy is random codes, but the flow uses a key generation service.
    apply:
      - setDecision: { decision: code-strategy, option: random-conditional }
    expect:
      scenario: s1-create
      fails: [code-strategy]

  - id: taken-alias-503
    base: postgres-redis-cache-aside
    description: A taken custom alias answers 503 instead of 409.
    apply:
      - linkOutcome: { operation: create-link, stepId: insert-alias, outcome: conflict, target: c503 }
    expect:
      scenario: s1-create
      fails: [taken-alias-409]

  - id: single-key-generator
    base: postgres-redis-cache-aside
    description: One key generation service instance; creation stops when it does.
    apply:
      - updateComponent: { id: kgs, replicas: 1 }
    expect:
      scenario: s1-create
      fails: [no-single-point-of-failure]

  - id: alias-ignored
    base: postgres-redis-cache-aside
    description: Requests for a custom alias get a generated code instead.
    apply:
      - removeStep: { operation: create-link, stepId: alias, bypass: generated }
    expect:
      scenario: s1-create
      fails: [custom-aliases-supported]

  - id: unsalted-rehash
    base: postgres-hash-based
    description: After a collision the same URL is hashed again without a salt, which gives the same code.
    apply:
      - updateStep: { operation: create-link, stepId: rehash, logic: hashUrl }
    expect:
      scenario: s1-create
      fails: [generated-collision-retried]

  - id: retry-without-insert
    base: dynamodb-redis-cache-aside
    description: A colliding code is replaced by a new one, but the request then fails without inserting it.
    apply:
      - linkOutcome: { operation: create-link, stepId: generate-retry, outcome: ok, target: c503 }
    expect:
      scenario: s1-create
      fails: [generated-collision-retried]


  # Faults, timeouts, retries and invalidation (S4, S6).
  - id: cache-without-timeout
    base: postgres-redis-cache-aside
    description: The redirect service waits for the cache without a timeout or a circuit breaker.
    apply:
      - setConnectionPolicy: { id: redirect-api--redis, timeoutMs: null, circuitBreaker: false }
    expect:
      scenario: s4-cache-outage
      fails: [cache-timeout]

  - id: retry-storm
    base: postgres-redis-cache-aside
    description: Database reads are retried ten times without backoff, and nothing caps them.
    apply:
      - setConnectionPolicy:
          { id: redirect-api--links-db, retries: 10, backoff: none, maxRps: null, circuitBreaker: false }
    expect:
      scenario: s4-cache-outage
      fails: [retries-bounded, stable-under-retries, no-cascade]

  - id: no-bulkhead
    base: postgres-redis-cache-aside
    description: Redirect misses reach the database without a cap, so a cache outage floods it.
    apply:
      - setConnectionPolicy: { id: redirect-api--links-db, maxRps: null }
    expect:
      scenario: s4-cache-outage
      fails: [no-cascade]

  - id: unreplicated-cache
    base: postgres-redis-fixed-fleet
    description: Redis runs without replicas, so a lost node takes its keys with it.
    apply:
      - updateComponent: { id: redis, replicas: 1 }
    expect:
      scenario: s4-cache-outage
      fails: [survives-node-loss]

  - id: cache-error-fails-redirect
    base: postgres-redis-cache-aside
    description: A cache error answers 503 instead of reading the store.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: error, target: r503 }
    expect:
      scenario: s4-cache-outage
      fails: [cache-failure-falls-back]
      band: not-passing

  - id: no-status-check
    base: postgres-redis-cache-aside
    description: Cache hits redirect without checking whether the link was disabled.
    apply:
      - removeStep: { operation: redirect, stepId: status-hit, bypass: active }
    expect:
      scenario: s4-cache-outage
      fails: [disabled-never-redirected]
      band: not-passing

  - id: no-invalidation
    base: postgres-redis-cache-aside
    description: Disabling a link updates the store but leaves the cached copy for its hour-long TTL.
    apply:
      - removeStep: { operation: disable-link, stepId: evict, bypass: ok }
    expect:
      scenario: s4-cache-outage
      fails: [invalidated-within-60s]
      band: not-passing

  - id: delete-before-update
    base: postgres-redis-cache-aside
    description: Disabling a link deletes the cache entry first and then updates the store.
    apply:
      - removeStep: { operation: disable-link, stepId: evict, bypass: ok }
      - addStep:
          operation: disable-link
          id: evict-first
          step: { type: call, target: redis, action: cache.delete, entity: Link }
          attach: { to: root }
          continueWith: { outcome: ok }
      - linkOutcome: { operation: disable-link, stepId: evict-first, outcome: error, target: d503 }
    expect:
      scenario: s4-cache-outage
      fails: [invalidated-within-60s]
      band: not-passing

  - id: permanent-redirect
    base: postgres-redis-cache-aside
    description: The service answers 301, which browsers cache forever.
    apply:
      - setDecision: { decision: redirect-status, option: "301" }
    expect:
      scenario: s4-cache-outage
      fails: [revocable-redirects]

  - id: async-replication
    base: postgres-redis-cache-aside
    description: The database replicates asynchronously, so a failover loses recent links.
    apply:
      - setDecision: { decision: replication-mode, option: async }
    expect:
      scenario: s6-dependency-failure
      fails: [no-acknowledged-loss]
      band: not-passing

  - id: store-without-timeout
    base: postgres-redis-cache-aside
    description: Creates wait for the database without a timeout, so a failover hangs them.
    apply:
      - setConnectionPolicy: { id: link-api--links-db, timeoutMs: null }
    expect:
      scenario: s6-dependency-failure
      fails: [creates-fail-fast]
      band: not-passing

  - id: retried-insert
    base: postgres-redis-cache-aside
    description: The conditional insert is retried after a timeout.
    apply:
      - setConnectionPolicy: { id: link-api--links-db, retries: 2 }
    expect:
      scenario: s6-dependency-failure
      fails: [no-unsafe-retries]

  - id: no-spare-redirect-server
    base: postgres-redis-fixed-fleet
    description: Exactly enough redirect servers for the peak; losing one overloads the rest.
    apply:
      - updateComponent: { id: redirect-api, replicas: 19 }
    expect:
      scenario: s6-dependency-failure
      fails: [survives-instance-loss]

  - id: database-without-replicas
    base: postgres-redis-cache-aside
    description: The database has no replicas, so a lost primary takes its reads with it.
    apply:
      - updateComponent: { id: links-db, replicas: 1 }
    expect:
      scenario: s6-dependency-failure
      fails: [redirects-survive-failover]

  # Hot keys, near caches and autoscaling (S5).
  - id: no-near-cache
    base: postgres-redis-cache-aside
    description: Redirects skip the near cache, so the viral link's 300,000 lookups a second hit one Redis shard.
    apply:
      - removeStep: { operation: redirect, stepId: near-get, bypass: miss }
    expect:
      scenario: s5-hot-keys
      fails: [hot-shard-headroom, spike-availability]

  - id: autoscaling-max-too-low
    base: postgres-redis-cache-aside
    description: The redirect service may only scale to 40 instances, far short of the spike.
    apply:
      - setAutoscale: { id: redirect-api, autoscale: { max: 40, targetUtilization: 0.7 } }
    expect:
      scenario: s5-hot-keys
      fails: [serves-spike]
      band: not-passing

  - id: fixed-fleet-sized-for-spike
    base: postgres-redis-cache-aside
    description: A fixed fleet of 90 redirect instances, paid for every day to survive one spike.
    apply:
      - setAutoscale: { id: redirect-api, autoscale: null }
      - updateComponent: { id: redirect-api, replicas: 90 }
    expect:
      scenario: s5-hot-keys
      fails: [within-budget, idle-fleet]

  - id: long-near-cache-ttl
    base: postgres-redis-cache-aside
    description: The near cache keeps links for ten minutes, so a disabled link keeps redirecting from every instance.
    apply:
      - updateStep: { operation: redirect, stepId: near-set, ttlSec: 600 }
    expect:
      scenario: s4-cache-outage
      fails: [invalidated-within-60s]
      band: not-passing

  - id: shared-near-cache
    base: postgres-redis-cache-aside
    description: Two services connect to one in-process cache, which can only live inside one of them.
    apply:
      - addConnection: { from: link-api, to: near }
    expect:
      scenario: s5-hot-keys
      invalid: [in-process-shared]

  - id: no-safety-scan
    base: postgres-redis-cache-aside
    description: Link creation neither checks URLs nor publishes them for a scan.
    apply:
      - removeStep: { operation: create-link, stepId: publish, bypass: ok }
      - removeFlow: { operation: scan-link }
    expect:
      scenario: s7-edge-cases
      fails: [unsafe-urls-stopped]
      band: not-passing

  - id: scan-ignores-verdict
    base: postgres-redis-cache-aside
    description: The scan consumer acknowledges a malicious verdict without disabling the link.
    apply:
      - linkOutcome: { operation: scan-link, stepId: check, outcome: malicious, target: s200 }
    expect:
      scenario: s7-edge-cases
      fails: [unsafe-urls-stopped]
      band: not-passing

  - id: scan-acknowledges-errors
    base: postgres-redis-cache-aside
    description: When the URL-safety API errors, the consumer answers "done", so the message is never delivered again.
    apply:
      - linkOutcome: { operation: scan-link, stepId: check, outcome: error, target: s200 }
    expect:
      scenario: s7-edge-cases
      fails: [scan-failures-retried]

  - id: scan-skips-eviction
    base: postgres-redis-cache-aside
    description: The consumer disables a malicious link in the store but leaves it in Redis for an hour.
    apply:
      - removeStep: { operation: scan-link, stepId: evict, bypass: ok }
    expect:
      scenario: s7-edge-cases
      fails: [scan-invalidates-caches]

  - id: starved-worker
    base: postgres-redis-cache-aside
    description: One small worker without autoscaling scans new links and purges expired ones.
    apply:
      - setAutoscale: { id: worker, autoscale: null }
      - updateComponent: { id: worker, replicas: 1 }
    expect:
      scenario: s7-edge-cases
      fails: [keeps-up, scan-disables-quickly]

  - id: scanner-without-timeout
    base: postgres-redis-cache-aside
    description: The worker waits for the URL-safety API without a timeout.
    apply:
      - setConnectionPolicy: { id: worker--safety, timeoutMs: null }
    expect:
      scenario: s7-edge-cases
      fails: [scanner-timeout]

  - id: consumer-not-subscribed
    base: postgres-redis-cache-aside
    description: The worker is not connected to the queue it is supposed to consume.
    apply:
      - removeConnection: { id: worker--link-events }
    expect:
      scenario: s7-edge-cases
      invalid: [flow-handler-unreachable]

  - id: delete-on-read
    base: postgres-redis-cache-aside
    description: The redirect deletes an expired link itself before answering 410.
    apply:
      - addStep:
          operation: redirect
          id: purge-now
          step: { type: call, target: links-db, action: store.delete, entity: Link }
          attach: { to: outcome, stepId: expiry-db, outcome: expired }
          continueWith: { outcome: ok }
      - linkOutcome: { operation: redirect, stepId: purge-now, outcome: error, target: r410 }
    expect:
      scenario: s7-edge-cases
      fails: [purge-off-the-read-path]

  - id: unbatched-purge
    base: postgres-redis-cache-aside
    description: The purge job deletes expired links one at a time.
    apply:
      - updateStep: { operation: purge-expired, stepId: delete, batchSize: null }
    expect:
      scenario: s7-edge-cases
      fails: [purge-batched]

  - id: immediate-code-reuse
    base: postgres-redis-cache-aside
    description: An expired code is handed to the next new link right away.
    apply:
      - setDecision: { decision: code-reuse, option: immediately }
    expect:
      scenario: s7-edge-cases
      fails: [safe-code-reuse]

  - id: reuse-with-permanent-redirects
    base: dynamodb-redis-cache-aside
    description: Codes are reused after a grace period, but redirects are 301s that browsers cache for good.
    apply:
      - setDecision: { decision: redirect-status, option: "301" }
    expect:
      scenario: s7-edge-cases
      fails: [reuse-without-permanent-redirects]

  - id: undecided-expired-status
    base: postgres-redis-cache-aside
    description: Expired links answer 410, but the expired-status decision was never recorded.
    apply:
      - setDecision: { decision: expired-status, option: null }
    expect:
      scenario: s7-edge-cases
      fails: [expired-status-as-decided]

  - id: fail-open-unscanned
    base: dynamodb-redis-cache-aside
    description: When the URL-safety API errors, the link is accepted and never checked again.
    apply:
      - linkOutcome: { operation: create-link, stepId: check, outcome: error, target: c201 }
    expect:
      scenario: s7-edge-cases
      fails: [unsafe-urls-stopped]

  - id: fail-closed-check
    base: dynamodb-redis-cache-aside
    description: When the URL-safety API errors, link creation fails with 503.
    apply:
      - linkOutcome: { operation: create-link, stepId: check, outcome: error, target: c503 }
    expect:
      scenario: s7-edge-cases
      fails: [creates-survive-scanner-outage]

  - id: batched-check-in-request
    base: dynamodb-redis-cache-aside
    description: The synchronous URL check waits for a batch of 50 requests.
    apply:
      - updateStep: { operation: create-link, stepId: check, batchSize: 50 }
    expect:
      scenario: s7-edge-cases
      invalid: [step-batch-in-request]
