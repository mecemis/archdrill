# yaml-language-server: $schema=../../../schema/mutants.schema.json
# Each mutant breaks a golden design in one specific way. CI asserts that the
# evaluator catches it: either validation blocks the scenario with the listed
# issue codes, or the listed checks fail.
mutants:
  - id: reverse-ingress
    base: postgres-redis-cache-aside
    description: The load balancer → redirect service connection points the wrong way.
    apply:
      - reverseConnection: { id: lb--redirect-api }
    expect:
      scenario: s2-redirect
      invalid: [flow-handler-unreachable]

  - id: reverse-cache-connection
    base: postgres-redis-cache-aside
    description: The redirect service → cache connection points the wrong way, so it cannot call the cache.
    apply:
      - reverseConnection: { id: redirect-api--redis }
    expect:
      scenario: s2-redirect
      invalid: [step-no-connection]

  - id: unhandled-not-found
    base: postgres-redis-cache-aside
    description: The store's notFound outcome leads nowhere.
    apply:
      - linkOutcome: { operation: redirect, stepId: read, outcome: notFound, target: null }
    expect:
      scenario: s2-redirect
      fails: [unknown-code-404]
      band: not-passing

  - id: negative-hit-redirects
    base: postgres-redis-cache-aside
    description: A negative cache hit is treated like a hit and redirected.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: negativeHit, target: expiry-hit }
    expect:
      scenario: s2-redirect
      fails: [redirect-backed-by-data, unknown-code-404]
      band: not-passing

  - id: blind-redirect-on-miss
    base: postgres-redis-cache-aside
    description: A cache miss redirects without reading the store.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: miss, target: r302 }
    expect:
      scenario: s2-redirect
      fails: [redirect-backed-by-data]
      band: not-passing

  - id: no-expiry-check-on-hit
    base: postgres-redis-cache-aside
    description: Cache hits redirect without checking expiry.
    apply:
      - removeStep: { operation: redirect, stepId: expiry-hit, bypass: valid }
    expect:
      scenario: s2-redirect
      fails: [expired-not-redirected]
      band: not-passing

  - id: no-populate
    base: postgres-redis-cache-aside
    description: Misses that find the link never write it back to the cache.
    apply:
      - removeStep: { operation: redirect, stepId: populate, bypass: ok }
    expect:
      scenario: s2-redirect
      fails: [cache-warms]

  - id: single-api-replica
    base: postgres-redis-cache-aside
    description: The redirect service runs as a single instance.
    apply:
      - updateComponent: { id: redirect-api, replicas: 1 }
    expect:
      scenario: s2-redirect
      fails: [no-single-point-of-failure]

  - id: cache-error-fails-request-single-node
    base: postgres-redis-fixed-fleet
    description: A cache error fails the request and the cache is a single node.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: error, target: r503 }
      - updateComponent: { id: redis, replicas: 1 }
    expect:
      scenario: s2-redirect
      fails: [no-single-point-of-failure]

  - id: store-error-unhandled
    base: dynamodb-direct
    description: The store's error outcome leads nowhere.
    apply:
      - linkOutcome: { operation: redirect, stepId: read, outcome: error, target: null }
    expect:
      scenario: s2-redirect
      fails: [errors-handled]

  - id: expired-redirects
    base: dynamodb-direct
    description: Expired links are redirected anyway.
    apply:
      - linkOutcome: { operation: redirect, stepId: expiry, outcome: expired, target: r302 }
    expect:
      scenario: s2-redirect
      fails: [expired-not-redirected, expired-answer]
      band: not-passing

  # Load, capacity and cost: caught by the simulation, not by the flow shape.
  - id: api-underprovisioned
    base: postgres-redis-fixed-fleet
    description: Ten redirect service instances for 300,000 redirects a second.
    apply:
      - updateComponent: { id: redirect-api, replicas: 10 }
    expect:
      scenario: s2-redirect
      fails: [serves-peak, no-overload-at-peak, headroom-at-peak, redirect-p99]
      band: not-passing

  - id: tiny-cache
    base: postgres-redis-cache-aside
    description: One small Redis node in front of the store.
    apply:
      - updateComponent: { id: redis, size: s, shards: 1, replicas: 1 }
    expect:
      scenario: s3-cache
      fails: [hit-ratio, serves-peak, no-overload-at-peak]
      band: not-passing

  - id: short-ttl
    base: postgres-redis-fixed-fleet
    description: Cache entries live for 10 seconds; the hit ratio drops and the misses overload the database.
    apply:
      - updateStep: { operation: redirect, stepId: populate, ttlSec: 10 }
    expect:
      scenario: s3-cache
      fails: [hit-ratio, serves-peak]
      band: not-passing

  - id: cache-never-populated
    base: postgres-redis-cache-aside
    description: >-
      Misses never write back, so only links created since the cache started
      are in it. (The simulation counts a cache that creates fill as filled,
      so the gate catches this one.)
    apply:
      - removeStep: { operation: redirect, stepId: populate, bypass: ok }
    expect:
      scenario: s3-cache
      fails: [cache-warms]
      band: not-passing

  - id: undersized-database
    base: postgres-redis-fixed-fleet
    description: A single database node takes every cache miss.
    apply:
      - updateComponent: { id: links-db, shards: 1, replicas: 1 }
    expect:
      scenario: s3-cache
      fails: [serves-peak, no-overload-at-peak, headroom-at-peak]
      band: not-passing

  - id: replica-sprawl
    base: postgres-redis-cache-aside
    description: Eight replicas per shard, each storing a full copy of 79 TB.
    apply:
      - updateComponent: { id: links-db, replicas: 8 }
    expect:
      scenario: s3-cache
      fails: [within-budget]
      band: not-passing

  - id: alb-for-redirects
    base: postgres-redis-cache-aside
    description: >-
      A managed load balancer instead of the NGINX fleet. Every click is a new
      visitor's connection, and ALB bills a capacity unit for every 25 new
      connections a second: about $23,000 a month on an average day.
    apply:
      - updateComponent: { id: lb, flavor: alb, size: managed, replicas: 1 }
    expect:
      scenario: s3-cache
      fails: [within-budget]
      band: not-passing

  # Write path (S1): uniqueness, durability, collisions and code space.
  - id: put-instead-of-conditional-insert
    base: postgres-redis-cache-aside
    description: The generated code is written with an overwriting put.
    apply:
      - updateStep: { operation: create-link, stepId: insert, action: store.insert }
    expect:
      scenario: s1-create
      fails: [atomic-uniqueness]
      band: not-passing

  - id: check-then-insert
    base: dynamodb-redis-cache-aside
    description: The flow reads the code first and puts it if absent, a TOCTOU race.
    apply:
      - updateStep: { operation: create-link, stepId: insert, action: store.insert }
      - addStep:
          operation: create-link
          id: probe
          step: { type: call, target: links, action: store.read, entity: Link }
          attach: { to: outcome, stepId: generate, outcome: ok }
          continueWith: { outcome: notFound }
    expect:
      scenario: s1-create
      fails: [no-check-then-insert, atomic-uniqueness]
      band: not-passing

  - id: collision-not-retried
    base: dynamodb-redis-cache-aside
    description: A colliding random code fails the request instead of being retried.
    apply:
      - linkOutcome: { operation: create-link, stepId: insert, outcome: conflict, target: c503 }
    expect:
      scenario: s1-create
      fails: [generated-collision-retried]

  - id: collision-answers-409
    base: dynamodb-redis-cache-aside
    description: A collision on a generated code is reported to the user as 409.
    apply:
      - linkOutcome: { operation: create-link, stepId: insert, outcome: conflict, target: c409 }
    expect:
      scenario: s1-create
      fails: [generated-collision-not-409, generated-collision-retried]

  - id: enumerable-codes
    base: mysql-memcached-cache-aside
    description: Leased counter values are encoded without being scrambled.
    apply:
      - removeStep: { operation: create-link, stepId: obfuscate, bypass: ok }
    expect:
      scenario: s1-create
      fails: [non-enumerable]

  - id: ack-before-write
    base: postgres-redis-cache-aside
    description: The service answers 201 as soon as it has a key, before storing the link.
    apply:
      - linkOutcome: { operation: create-link, stepId: allocate, outcome: ok, target: c201 }
    expect:
      scenario: s1-create
      fails: [durable-before-ack, atomic-uniqueness]
      band: not-passing

  - id: no-url-validation
    base: postgres-redis-cache-aside
    description: URLs are stored without validation.
    apply:
      - removeStep: { operation: create-link, stepId: validate, bypass: valid }
    expect:
      scenario: s1-create
      fails: [validates-before-writing]
      band: not-passing

  - id: six-character-codes
    base: dynamodb-direct
    description: Six-character random codes; 158 billion links do not fit in 62⁶ codes.
    apply:
      - setDecision: { decision: code-length, option: "6" }
    expect:
      scenario: s1-create
      fails: [serves-peak, creates-succeed]
      band: not-passing

  - id: seven-characters-one-retry
    base: dynamodb-redis-cache-aside
    description: Seven-character random codes with a single retry fail about 0.2% of creates at 5-year occupancy.
    apply:
      - setDecision: { decision: code-length, option: "7" }
    expect:
      scenario: s1-create
      fails: [creates-succeed]

  - id: decision-contradicts-flow
    base: postgres-redis-cache-aside
    description: The declared strategy is random codes, but the flow uses a key generation service.
    apply:
      - setDecision: { decision: code-strategy, option: random-conditional }
    expect:
      scenario: s1-create
      fails: [code-strategy]

  - id: taken-alias-503
    base: postgres-redis-cache-aside
    description: A taken custom alias answers 503 instead of 409.
    apply:
      - linkOutcome: { operation: create-link, stepId: insert-alias, outcome: conflict, target: c503 }
    expect:
      scenario: s1-create
      fails: [taken-alias-409]

  - id: single-key-generator
    base: postgres-redis-cache-aside
    description: One key generation service instance; creation stops when it does.
    apply:
      - updateComponent: { id: kgs, replicas: 1 }
    expect:
      scenario: s1-create
      fails: [no-single-point-of-failure]

  - id: alias-ignored
    base: postgres-redis-cache-aside
    description: Requests for a custom alias get a generated code instead.
    apply:
      - removeStep: { operation: create-link, stepId: alias, bypass: generated }
    expect:
      scenario: s1-create
      fails: [custom-aliases-supported]

  - id: unsalted-rehash
    base: postgres-hash-based
    description: After a collision the same URL is hashed again without a salt, which gives the same code.
    apply:
      - updateStep: { operation: create-link, stepId: rehash, logic: hashUrl }
    expect:
      scenario: s1-create
      fails: [generated-collision-retried]

  - id: retry-without-insert
    base: dynamodb-redis-cache-aside
    description: A colliding code is replaced by a new one, but the request then fails without inserting it.
    apply:
      - linkOutcome: { operation: create-link, stepId: generate-retry, outcome: ok, target: c503 }
    expect:
      scenario: s1-create
      fails: [generated-collision-retried]


  # Faults, timeouts, retries and invalidation (S4, S6).
  - id: cache-without-timeout
    base: postgres-redis-cache-aside
    description: The redirect service waits for the cache without a timeout or a circuit breaker.
    apply:
      - setConnectionPolicy: { id: redirect-api--redis, timeoutMs: null, circuitBreaker: false }
    expect:
      scenario: s4-cache-outage
      fails: [cache-timeout]

  - id: retry-storm
    base: postgres-redis-cache-aside
    description: Database reads are retried ten times without backoff, and nothing caps them.
    apply:
      - setConnectionPolicy:
          { id: redirect-api--links-db, retries: 10, backoff: none, maxRps: null, circuitBreaker: false }
    expect:
      scenario: s4-cache-outage
      fails: [retries-bounded, stable-under-retries, no-cascade]

  - id: no-bulkhead
    base: postgres-redis-cache-aside
    description: Redirect misses reach the database without a cap, so a cache outage floods it.
    apply:
      - setConnectionPolicy: { id: redirect-api--links-db, maxRps: null }
    expect:
      scenario: s4-cache-outage
      fails: [no-cascade]

  - id: unreplicated-cache
    base: postgres-redis-fixed-fleet
    description: Redis runs without replicas, so a lost node takes its keys with it.
    apply:
      - updateComponent: { id: redis, replicas: 1 }
    expect:
      scenario: s4-cache-outage
      fails: [survives-node-loss]

  - id: cache-error-fails-redirect
    base: postgres-redis-cache-aside
    description: A cache error answers 503 instead of reading the store.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: error, target: r503 }
    expect:
      scenario: s4-cache-outage
      fails: [cache-failure-falls-back]
      band: not-passing

  - id: no-status-check
    base: postgres-redis-cache-aside
    description: Cache hits redirect without checking whether the link was disabled.
    apply:
      - removeStep: { operation: redirect, stepId: status-hit, bypass: active }
    expect:
      scenario: s4-cache-outage
      fails: [disabled-never-redirected]
      band: not-passing

  - id: no-invalidation
    base: postgres-redis-cache-aside
    description: Disabling a link updates the store but leaves the cached copy for its hour-long TTL.
    apply:
      - removeStep: { operation: disable-link, stepId: evict, bypass: ok }
    expect:
      scenario: s4-cache-outage
      fails: [invalidated-within-60s]
      band: not-passing

  - id: delete-before-update
    base: postgres-redis-cache-aside
    description: Disabling a link deletes the cache entry first and then updates the store.
    apply:
      - removeStep: { operation: disable-link, stepId: evict, bypass: ok }
      - addStep:
          operation: disable-link
          id: evict-first
          step: { type: call, target: redis, action: cache.delete, entity: Link }
          attach: { to: root }
          continueWith: { outcome: ok }
      - linkOutcome: { operation: disable-link, stepId: evict-first, outcome: error, target: d503 }
    expect:
      scenario: s4-cache-outage
      fails: [invalidated-within-60s]
      band: not-passing

  - id: permanent-redirect
    base: postgres-redis-cache-aside
    description: The service answers 301, which browsers cache forever.
    apply:
      - setDecision: { decision: redirect-status, option: "301" }
    expect:
      scenario: s4-cache-outage
      fails: [revocable-redirects]

  - id: async-replication
    base: postgres-redis-cache-aside
    description: The database replicates asynchronously, so a failover loses recent links.
    apply:
      - setDecision: { decision: replication-mode, option: async }
    expect:
      scenario: s6-dependency-failure
      fails: [no-acknowledged-loss]
      band: not-passing

  - id: store-without-timeout
    base: postgres-redis-cache-aside
    description: Creates wait for the database without a timeout, so a failover hangs them.
    apply:
      - setConnectionPolicy: { id: link-api--links-db, timeoutMs: null }
    expect:
      scenario: s6-dependency-failure
      fails: [creates-fail-fast]
      band: not-passing

  - id: retried-insert
    base: postgres-redis-cache-aside
    description: The conditional insert is retried after a timeout.
    apply:
      - setConnectionPolicy: { id: link-api--links-db, retries: 2 }
    expect:
      scenario: s6-dependency-failure
      fails: [no-unsafe-retries]

  - id: no-spare-redirect-server
    base: postgres-redis-fixed-fleet
    description: Exactly enough redirect servers for the peak; losing one overloads the rest.
    apply:
      - updateComponent: { id: redirect-api, replicas: 19 }
    expect:
      scenario: s6-dependency-failure
      fails: [survives-instance-loss]

  - id: bulkhead-sized-for-a-warm-cache
    base: postgres-redis-fixed-fleet
    description: >-
      The bulkhead in front of the database fits the misses of a warm cache,
      so after a cache restart it sheds redirects for minutes.
    apply:
      - setConnectionPolicy: { id: redirect-api--links-db, maxRps: 60000 }
    expect:
      scenario: s4-cache-outage
      fails: [restart-recovers]

  - id: database-without-replicas
    base: postgres-redis-cache-aside
    description: The database has no replicas, so a lost primary takes its reads with it.
    apply:
      - updateComponent: { id: links-db, replicas: 1 }
    expect:
      scenario: s6-dependency-failure
      fails: [redirects-survive-failover, redirects-through-failover]

  # A lost availability zone (S6).
  - id: redirect-servers-in-one-zone
    base: postgres-redis-cache-aside
    description: Every redirect server runs in one zone, so losing it stops every redirect.
    apply:
      - updateComponent: { id: redirect-api, zones: 1 }
    expect:
      scenario: s6-dependency-failure
      fails: [redirects-zone-redundant, redirects-survive-zone-loss]
      band: not-passing

  - id: database-in-one-zone
    base: postgres-redis-cache-aside
    description: >-
      The database's primaries and replicas share one zone, so losing it
      leaves nothing to fail over to: creates stop, and redirects that miss
      the cache fail.
    apply:
      - updateComponent: { id: links-db, zones: 1 }
    expect:
      scenario: s6-dependency-failure
      fails: [creates-zone-redundant, creates-back-after-zone-loss]

  - id: cache-in-one-zone
    base: postgres-redis-cache-aside
    description: >-
      Every Redis node sits in one zone. Losing it sends every redirect to the
      database at once, and the bulkhead sheds what the database cannot take.
    apply:
      - updateComponent: { id: redis, zones: 1 }
    expect:
      scenario: s6-dependency-failure
      fails: [redirects-survive-zone-loss]

  - id: scaled-to-seventy-percent
    base: postgres-redis-cache-aside
    description: >-
      Redirect servers autoscale to 70% across three zones. When a zone goes,
      the two left run at 105% until new instances start.
    apply:
      - setAutoscale: { id: redirect-api, autoscale: { max: 120, targetUtilization: 0.7 } }
    expect:
      scenario: s6-dependency-failure
      fails: [redirects-survive-zone-loss, redirects-through-zone-loss]

  - id: fixed-fleet-without-zone-spare
    base: postgres-redis-fixed-fleet
    description: >-
      Enough redirect servers for the peak plus one, in three zones: a lost
      zone takes a third of them, and the rest are overloaded.
    apply:
      - updateComponent: { id: redirect-api, replicas: 25 }
    expect:
      scenario: s6-dependency-failure
      fails: [redirects-survive-zone-loss, redirects-through-zone-loss]

  - id: consensus-across-two-zones
    base: mysql-memcached-cache-aside
    description: >-
      etcd's three members span two zones, so one zone holds two of them:
      losing it takes etcd's majority, and every create that needs a key.
    apply:
      - updateComponent: { id: etcd, zones: 2 }
    expect:
      scenario: s6-dependency-failure
      fails: [creates-zone-redundant]

  # Traffic between zones (S3).
  - id: proxies-route-across-zones
    base: postgres-redis-cache-aside
    description: >-
      NGINX spreads redirects over the Redirect API in every zone, so two in
      three cross to another one: about $3,000 a month in transfer charges
      that zone-aware routing would save.
    apply:
      - setConnectionPolicy: { id: lb--redirect-api, sameZone: false }
    expect:
      scenario: s3-cache
      fails: [zone-local-calls]

  - id: cache-reads-across-zones
    base: dynamodb-redis-cache-aside
    description: >-
      The Link API reads Redis from any replica rather than the one in its
      zone, so two cache reads in three cross zones.
    apply:
      - setConnectionPolicy: { id: link-api--redis, sameZone: false }
    expect:
      scenario: s3-cache
      fails: [zone-local-calls]

  # A lost region (S9).
  - id: database-without-standby
    base: postgres-redis-two-regions
    description: >-
      The database runs only in the primary region. Losing it takes every
      link with it: creates stop, and redirects that miss the cache fail.
    apply:
      - updateComponent: { id: links-db, regions: 1 }
    expect:
      scenario: s9-region-loss
      fails: [creates-region-redundant, no-link-lost-with-region, redirects-survive-region-loss]
      band: not-passing

  - id: proxies-without-standby
    base: postgres-redis-two-regions
    description: >-
      NGINX runs only in the primary region, so the standby region has
      everything behind it and no way in.
    apply:
      - updateComponent: { id: lb, regions: 1 }
    expect:
      scenario: s9-region-loss
      fails: [redirects-region-redundant, redirects-back-after-region-loss]
      band: not-passing

  - id: cache-without-standby
    base: postgres-redis-two-regions
    description: >-
      Redis runs only in the primary region. Redirects survive on the
      database alone, but the bulkhead in front of it sheds most of the
      peak once the standby region takes over.
    apply:
      - updateComponent: { id: redis, regions: 1 }
    expect:
      scenario: s9-region-loss
      fails: [redirects-survive-region-loss, redirects-back-after-region-loss]

  - id: single-region-table
    base: dynamodb-redis-two-regions
    description: >-
      The links table is a single-region table, not a global table, so it
      goes with the region.
    apply:
      - updateComponent: { id: links, regions: 1 }
    expect:
      scenario: s9-region-loss
      fails: [creates-region-redundant, no-link-lost-with-region]
      band: not-passing

  # Reading a write right after it (S2), and what consistent reads cost (S4).
  - id: create-skips-cache-fill
    base: postgres-redis-cache-aside
    description: >-
      Creates no longer fill the cache. A link opened right after it is
      created reads a replica that may not have it yet, and the negative
      cache keeps the 404 for a minute.
    apply:
      - removeStep: { operation: create-link, stepId: prime, bypass: ok }
    expect:
      scenario: s2-redirect
      fails: [fresh-links-redirect]

  - id: eventual-table-reads
    base: dynamodb-direct
    description: >-
      Redirects read the table with DynamoDB's default, eventually consistent
      reads, so a brand-new link can answer 404.
    apply:
      - updateStep: { operation: redirect, stepId: read, consistent: null }
    expect:
      scenario: s2-redirect
      fails: [fresh-links-redirect]

  - id: consistent-reads-everywhere
    base: postgres-redis-cache-aside
    description: >-
      Every redirect that misses the cache reads the primary. Only one copy
      of each shard can serve those reads, so when the cache goes, the
      database cannot take the misses, and creates fail with them.
    apply:
      - updateStep: { operation: redirect, stepId: read, consistent: true }
    expect:
      scenario: s4-cache-outage
      fails: [no-cascade]

  # Both regions taking creates (S9).
  - id: active-active-local-creates
    base: dynamodb-redis-active-active
    description: >-
      Both regions take creates, and each writes to its own replica of the
      global table. The conditional insert checks only that replica, so two
      people can claim the same alias in different regions at once, and the
      table keeps the last write.
    apply:
      - updateStep: { operation: create-link, stepId: insert-alias, homeRegion: null }
      - updateStep: { operation: create-link, stepId: insert, homeRegion: null }
      - updateStep: { operation: create-link, stepId: insert-retry, homeRegion: null }
    expect:
      scenario: s9-region-loss
      fails: [codes-unique-across-regions]
      band: not-passing

  # Hot keys, near caches and autoscaling (S5).
  - id: no-near-cache
    base: postgres-redis-cache-aside
    description: >-
      Redirects skip the near cache. Redis carries the viral link's 300,000
      lookups a second on one shard's two copies, but the popular links the
      near cache held now miss through to the database, whose bulkhead sheds
      them.
    apply:
      - removeStep: { operation: redirect, stepId: near-get, bypass: miss }
    expect:
      scenario: s5-hot-keys
      fails: [serves-spike, spike-availability]

  - id: autoscaling-max-too-low
    base: postgres-redis-cache-aside
    description: The redirect service may only scale to 40 instances, far short of the spike.
    apply:
      - setAutoscale: { id: redirect-api, autoscale: { max: 40, targetUtilization: 0.7 } }
    expect:
      scenario: s5-hot-keys
      fails: [serves-spike]
      band: not-passing

  - id: fixed-fleet-sized-for-spike
    base: postgres-redis-cache-aside
    description: A fixed fleet of 90 redirect instances, paid for every day to survive one spike.
    apply:
      - setAutoscale: { id: redirect-api, autoscale: null }
      - updateComponent: { id: redirect-api, replicas: 90 }
    expect:
      scenario: s5-hot-keys
      fails: [within-budget, idle-fleet]

  - id: long-near-cache-ttl
    base: postgres-redis-cache-aside
    description: The near cache keeps links for ten minutes, so a disabled link keeps redirecting from every instance.
    apply:
      - updateStep: { operation: redirect, stepId: near-set, ttlSec: 600 }
    expect:
      scenario: s4-cache-outage
      fails: [invalidated-within-60s]
      band: not-passing

  - id: shared-near-cache
    base: postgres-redis-cache-aside
    description: Two services connect to one in-process cache, which can only live inside one of them.
    apply:
      - addConnection: { from: link-api, to: near }
    expect:
      scenario: s5-hot-keys
      invalid: [in-process-shared]

  - id: no-safety-scan
    base: postgres-redis-cache-aside
    description: Link creation neither checks URLs nor publishes them for a scan.
    apply:
      - removeStep: { operation: create-link, stepId: publish, bypass: ok }
      - removeFlow: { operation: scan-link }
    expect:
      scenario: s7-edge-cases
      fails: [unsafe-urls-stopped]
      band: not-passing

  - id: scan-ignores-verdict
    base: postgres-redis-cache-aside
    description: The scan consumer acknowledges a malicious verdict without disabling the link.
    apply:
      - linkOutcome: { operation: scan-link, stepId: check, outcome: malicious, target: s200 }
    expect:
      scenario: s7-edge-cases
      fails: [unsafe-urls-stopped]
      band: not-passing

  - id: scan-acknowledges-errors
    base: postgres-redis-cache-aside
    description: When the URL-safety API errors, the consumer answers "done", so the message is never delivered again.
    apply:
      - linkOutcome: { operation: scan-link, stepId: check, outcome: error, target: s200 }
    expect:
      scenario: s7-edge-cases
      fails: [scan-failures-retried]

  - id: scan-skips-eviction
    base: postgres-redis-cache-aside
    description: The consumer disables a malicious link in the store but leaves it in Redis for an hour.
    apply:
      - removeStep: { operation: scan-link, stepId: evict, bypass: ok }
    expect:
      scenario: s7-edge-cases
      fails: [scan-invalidates-caches]

  - id: starved-worker
    base: postgres-redis-cache-aside
    description: One small worker without autoscaling scans new links and purges expired ones.
    apply:
      - setAutoscale: { id: worker, autoscale: null }
      - updateComponent: { id: worker, replicas: 1 }
    expect:
      scenario: s7-edge-cases
      fails: [keeps-up, scan-disables-quickly]

  - id: lookup-every-url
    base: postgres-redis-cache-aside
    description: >-
      The worker looks every new URL up with the Lookup API instead of
      matching a local copy of the lists: 3,000 calls a second against a
      quota of 100, and redeliveries of the failed scans on top.
    apply:
      - removeStep: { operation: scan-link, stepId: match, bypass: match }
      - updateComponent: { id: safety, flavor: url-safety }
    expect:
      scenario: s7-edge-cases
      fails: [scans-succeed-at-peak, headroom-at-peak, scans-recover-after-import]

  - id: unconfirmed-match
    base: postgres-redis-cache-aside
    description: The worker disables every link that matches the local lists without asking the API.
    apply:
      - linkOutcome: { operation: scan-link, stepId: match, outcome: match, target: disable }
    expect:
      scenario: s7-edge-cases
      fails: [matches-confirmed]

  - id: list-without-source
    base: postgres-redis-cache-aside
    description: The worker matches URLs against local lists, but the API it calls is the Lookup API, which provides none.
    apply:
      - updateComponent: { id: safety, flavor: url-safety }
    expect:
      scenario: s7-edge-cases
      invalid: [step-logic-needs-component]

  - id: autoscaling-target-too-high
    base: postgres-redis-cache-aside
    description: >-
      The redirect service scales at 80% utilisation, which leaves no room
      for the growth during the minute new instances take to start.
    apply:
      - setAutoscale: { id: redirect-api, autoscale: { max: 120, targetUtilization: 0.8 } }
    expect:
      scenario: s5-hot-keys
      fails: [surge-served]

  - id: scanner-without-timeout
    base: postgres-redis-cache-aside
    description: The worker waits for the URL-safety API without a timeout.
    apply:
      - setConnectionPolicy: { id: worker--safety, timeoutMs: null }
    expect:
      scenario: s7-edge-cases
      fails: [scanner-timeout]

  - id: consumer-not-subscribed
    base: postgres-redis-cache-aside
    description: The worker is not connected to the queue it is supposed to consume, so new links pile up unscanned.
    apply:
      - removeConnection: { id: worker--link-events }
    expect:
      scenario: s7-edge-cases
      fails: [unsafe-urls-stopped]
      band: not-passing

  - id: delete-on-read
    base: postgres-redis-cache-aside
    description: The redirect deletes an expired link itself before answering 410.
    apply:
      - addStep:
          operation: redirect
          id: purge-now
          step: { type: call, target: links-db, action: store.delete, entity: Link }
          attach: { to: outcome, stepId: expiry-db, outcome: expired }
          continueWith: { outcome: ok }
      - linkOutcome: { operation: redirect, stepId: purge-now, outcome: error, target: r410 }
    expect:
      scenario: s7-edge-cases
      fails: [purge-off-the-read-path]

  - id: unbatched-purge
    base: postgres-redis-cache-aside
    description: The purge job deletes expired links one at a time.
    apply:
      - updateStep: { operation: purge-expired, stepId: delete, batchSize: null }
    expect:
      scenario: s7-edge-cases
      fails: [purge-batched]

  - id: immediate-code-reuse
    base: postgres-redis-cache-aside
    description: An expired code is handed to the next new link right away.
    apply:
      - setDecision: { decision: code-reuse, option: immediately }
    expect:
      scenario: s7-edge-cases
      fails: [safe-code-reuse]

  - id: reuse-with-permanent-redirects
    base: dynamodb-redis-cache-aside
    description: Codes are reused after a grace period, but redirects are 301s that browsers cache for good.
    apply:
      - setDecision: { decision: redirect-status, option: "301" }
    expect:
      scenario: s7-edge-cases
      fails: [reuse-without-permanent-redirects]

  - id: undecided-expired-status
    base: postgres-redis-cache-aside
    description: Expired links answer 410, but the expired-status decision was never recorded.
    apply:
      - setDecision: { decision: expired-status, option: null }
    expect:
      scenario: s7-edge-cases
      fails: [expired-status-as-decided]

  - id: fail-open-unscanned
    base: dynamodb-redis-cache-aside
    description: When the URL-safety API errors, the link is accepted and never checked again.
    apply:
      - linkOutcome: { operation: create-link, stepId: check, outcome: error, target: c201 }
    expect:
      scenario: s7-edge-cases
      fails: [unsafe-urls-stopped]

  - id: fail-closed-check
    base: dynamodb-redis-cache-aside
    description: >-
      When a confirmation fails, link creation fails with 503: one create in
      500 matches the local lists, more failures than 99.9% allows.
    apply:
      - linkOutcome: { operation: create-link, stepId: check, outcome: error, target: c503 }
    expect:
      scenario: s7-edge-cases
      fails: [creates-survive-scanner-outage]

  - id: batched-publish-in-request
    base: dynamodb-redis-cache-aside
    description: The create waits until 50 links are ready to publish for a rescan.
    apply:
      - updateStep: { operation: create-link, stepId: publish, batchSize: 50 }
    expect:
      scenario: s7-edge-cases
      invalid: [step-batch-in-request]

  # S8: click analytics.
  - id: count-on-redirect
    base: postgres-redis-cache-aside
    description: The redirect increments the link's click count in the links database before answering.
    apply:
      - setComponentData: { id: links-db, entities: [Link, LinkStats] }
      - addStep:
          operation: redirect
          id: count
          step: { type: call, target: links-db, action: counter.increment, entity: LinkStats }
          attach: { to: outcome, stepId: expiry-hit, outcome: valid }
          continueWith: { outcome: ok }
    expect:
      scenario: s8-click-analytics
      fails: [no-write-on-redirect]
      band: not-passing

  - id: waiting-click-publish
    base: postgres-redis-cache-aside
    description: The redirect waits for the click queue to take each click, with no timeout.
    apply:
      - updateStep:
          operation: redirect
          stepId: click
          fireAndForget: null
          bufferSize: null
          batchSize: null
      - linkOutcome: { operation: redirect, stepId: click, outcome: error, target: r302 }
    expect:
      scenario: s8-click-analytics
      fails: [clicks-published, redirects-fast-queue-down]

  - id: unbounded-click-buffer
    base: postgres-redis-cache-aside
    description: Clicks are buffered fire-and-forget without a bound.
    apply:
      - updateStep: { operation: redirect, stepId: click, bufferSize: null }
    expect:
      scenario: s8-click-analytics
      fails: [clicks-published]

  - id: clicks-not-consumed
    base: postgres-redis-cache-aside
    description: Clicks are published, but nothing consumes them.
    apply:
      - removeFlow: { operation: record-click }
    expect:
      scenario: s8-click-analytics
      fails: [clicks-counted]
      band: not-passing

  - id: increments-without-dedupe
    base: postgres-redis-cache-aside
    description: The counter increments per link and window instead of writing the window's total.
    apply:
      - updateStep: { operation: record-click, stepId: total, action: counter.increment }
    expect:
      scenario: s8-click-analytics
      fails: [no-double-count]

  - id: retried-increments
    base: postgres-redis-cache-aside
    description: Increments are retried on timeouts.
    apply:
      - updateStep: { operation: record-click, stepId: total, action: counter.increment }
      - setConnectionPolicy: { id: click-counter--click-stats, retries: 2 }
    expect:
      scenario: s8-click-analytics
      fails: [increments-not-retried, no-double-count]

  - id: write-per-click
    base: postgres-redis-cache-aside
    description: The counter writes every click as it arrives, without a window or batches.
    apply:
      - updateStep:
          operation: record-click
          stepId: total
          aggregateSec: null
          batchSize: null
    expect:
      scenario: s8-click-analytics
      fails: [viral-clicks-counted]

  - id: stale-click-window
    base: postgres-redis-cache-aside
    description: Clicks are summed over two-minute windows.
    apply:
      - updateStep: { operation: record-click, stepId: total, aggregateSec: 120 }
    expect:
      scenario: s8-click-analytics
      fails: [counts-fresh]

  - id: permanent-redirect-hides-clicks
    base: postgres-redis-cache-aside
    description: Redirects answer 301, so browsers cache them.
    apply:
      - setDecision: { decision: redirect-status, option: "301" }
    expect:
      scenario: s8-click-analytics
      fails: [countable-redirects]

  - id: clicks-in-managed-queue
    base: postgres-redis-cache-aside
    description: Clicks go through a managed queue billed per message instead of Kafka.
    apply:
      - updateComponent: { id: clicks, flavor: managed-queue, size: on-demand }
    expect:
      scenario: s8-click-analytics
      fails: [within-budget]
