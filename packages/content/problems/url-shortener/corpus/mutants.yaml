# Each mutant breaks a golden design in one specific way. CI asserts that the
# evaluator catches it: either validation blocks the scenario with the listed
# issue codes, or the listed checks fail.
mutants:
  - id: reverse-ingress
    base: postgres-redis-cache-aside
    description: The load balancer → API connection points the wrong way.
    apply:
      - reverseConnection: { id: lb--link-api }
    expect:
      scenario: s2-redirect
      invalid: [flow-handler-unreachable]

  - id: reverse-cache-connection
    base: postgres-redis-cache-aside
    description: The API → cache connection points the wrong way, so the API cannot call the cache.
    apply:
      - reverseConnection: { id: link-api--redis }
    expect:
      scenario: s2-redirect
      invalid: [step-no-connection]

  - id: unhandled-not-found
    base: postgres-redis-cache-aside
    description: The store's notFound outcome leads nowhere.
    apply:
      - linkOutcome: { operation: redirect, stepId: read, outcome: notFound, target: null }
    expect:
      scenario: s2-redirect
      fails: [unknown-code-404]
      band: not-passing

  - id: negative-hit-redirects
    base: postgres-redis-cache-aside
    description: A negative cache hit is treated like a hit and redirected.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: negativeHit, target: expiry-hit }
    expect:
      scenario: s2-redirect
      fails: [redirect-backed-by-data, unknown-code-404]
      band: not-passing

  - id: blind-redirect-on-miss
    base: postgres-redis-cache-aside
    description: A cache miss redirects without reading the store.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: miss, target: r302 }
    expect:
      scenario: s2-redirect
      fails: [redirect-backed-by-data]
      band: not-passing

  - id: no-expiry-check-on-hit
    base: postgres-redis-cache-aside
    description: Cache hits redirect without checking expiry.
    apply:
      - removeStep: { operation: redirect, stepId: expiry-hit, bypass: valid }
    expect:
      scenario: s2-redirect
      fails: [expired-not-redirected]
      band: not-passing

  - id: no-populate
    base: postgres-redis-cache-aside
    description: Misses that find the link never write it back to the cache.
    apply:
      - removeStep: { operation: redirect, stepId: populate, bypass: ok }
    expect:
      scenario: s2-redirect
      fails: [cache-warms]

  - id: single-api-replica
    base: postgres-redis-cache-aside
    description: The API runs as a single instance.
    apply:
      - updateComponent: { id: link-api, replicas: 1 }
    expect:
      scenario: s2-redirect
      fails: [no-single-point-of-failure]

  - id: cache-error-fails-request-single-node
    base: postgres-redis-cache-aside
    description: A cache error fails the request and the cache is a single node.
    apply:
      - linkOutcome: { operation: redirect, stepId: get, outcome: error, target: r503 }
      - updateComponent: { id: redis, replicas: 1 }
    expect:
      scenario: s2-redirect
      fails: [no-single-point-of-failure]

  - id: store-error-unhandled
    base: dynamodb-direct
    description: The store's error outcome leads nowhere.
    apply:
      - linkOutcome: { operation: redirect, stepId: read, outcome: error, target: null }
    expect:
      scenario: s2-redirect
      fails: [errors-handled]

  - id: expired-redirects
    base: dynamodb-direct
    description: Expired links are redirected anyway.
    apply:
      - linkOutcome: { operation: redirect, stepId: expiry, outcome: expired, target: r302 }
    expect:
      scenario: s2-redirect
      fails: [expired-not-redirected, expired-answer]
      band: not-passing

  # Load, capacity and cost: caught by the simulation, not by the flow shape.
  - id: api-underprovisioned
    base: postgres-redis-cache-aside
    description: Ten API instances for 300,000 redirects a second.
    apply:
      - updateComponent: { id: link-api, replicas: 10 }
    expect:
      scenario: s2-redirect
      fails: [serves-peak, no-overload-at-peak, headroom-at-peak, redirect-p99]
      band: not-passing

  - id: tiny-cache
    base: postgres-redis-cache-aside
    description: One small Redis node in front of the store.
    apply:
      - updateComponent: { id: redis, size: s, shards: 1, replicas: 1 }
    expect:
      scenario: s3-cache
      fails: [hit-ratio, serves-peak, no-overload-at-peak]
      band: not-passing

  - id: short-ttl
    base: postgres-redis-cache-aside
    description: Cache entries live for 30 seconds; the hit ratio drops and the misses overload the database.
    apply:
      - updateStep: { operation: redirect, stepId: populate, ttlSec: 30 }
    expect:
      scenario: s3-cache
      fails: [hit-ratio, serves-peak]
      band: not-passing

  - id: cache-never-populated
    base: postgres-redis-cache-aside
    description: Misses never write back, so the cache stays empty.
    apply:
      - removeStep: { operation: redirect, stepId: populate, bypass: ok }
    expect:
      scenario: s3-cache
      fails: [cache-warms, hit-ratio]
      band: not-passing

  - id: undersized-database
    base: postgres-redis-cache-aside
    description: A single database node takes every cache miss.
    apply:
      - updateComponent: { id: links-db, shards: 1, replicas: 1 }
    expect:
      scenario: s3-cache
      fails: [serves-peak, no-overload-at-peak, headroom-at-peak]
      band: not-passing

  - id: replica-sprawl
    base: postgres-redis-cache-aside
    description: Eight replicas per shard, each storing a full copy of 79 TB.
    apply:
      - updateComponent: { id: links-db, replicas: 8 }
    expect:
      scenario: s3-cache
      fails: [within-budget]
      band: not-passing

  # Write path (S1): uniqueness, durability, collisions and code space.
  - id: put-instead-of-conditional-insert
    base: postgres-redis-cache-aside
    description: The generated code is written with an overwriting put.
    apply:
      - updateStep: { operation: create-link, stepId: insert, action: store.insert }
    expect:
      scenario: s1-create
      fails: [atomic-uniqueness]
      band: not-passing

  - id: check-then-insert
    base: dynamodb-redis-cache-aside
    description: The flow reads the code first and puts it if absent, a TOCTOU race.
    apply:
      - updateStep: { operation: create-link, stepId: insert, action: store.insert }
      - addStep:
          operation: create-link
          id: probe
          step: { type: call, target: links, action: store.read, entity: Link }
          attach: { to: outcome, stepId: generate, outcome: ok }
          continueWith: { outcome: notFound }
    expect:
      scenario: s1-create
      fails: [no-check-then-insert, atomic-uniqueness]
      band: not-passing

  - id: collision-not-retried
    base: dynamodb-redis-cache-aside
    description: A colliding random code fails the request instead of being retried.
    apply:
      - linkOutcome: { operation: create-link, stepId: insert, outcome: conflict, target: c503 }
    expect:
      scenario: s1-create
      fails: [generated-collision-retried]

  - id: collision-answers-409
    base: dynamodb-redis-cache-aside
    description: A collision on a generated code is reported to the user as 409.
    apply:
      - linkOutcome: { operation: create-link, stepId: insert, outcome: conflict, target: c409 }
    expect:
      scenario: s1-create
      fails: [generated-collision-not-409, generated-collision-retried]

  - id: enumerable-codes
    base: mysql-memcached-cache-aside
    description: Leased counter values are encoded without being scrambled.
    apply:
      - removeStep: { operation: create-link, stepId: obfuscate, bypass: ok }
    expect:
      scenario: s1-create
      fails: [non-enumerable]

  - id: ack-before-write
    base: postgres-redis-cache-aside
    description: The service answers 201 as soon as it has a key, before storing the link.
    apply:
      - linkOutcome: { operation: create-link, stepId: allocate, outcome: ok, target: c201 }
    expect:
      scenario: s1-create
      fails: [durable-before-ack, atomic-uniqueness]
      band: not-passing

  - id: no-url-validation
    base: postgres-redis-cache-aside
    description: URLs are stored without validation.
    apply:
      - removeStep: { operation: create-link, stepId: validate, bypass: valid }
    expect:
      scenario: s1-create
      fails: [validates-before-writing]
      band: not-passing

  - id: six-character-codes
    base: dynamodb-direct
    description: Six-character random codes; 158 billion links do not fit in 62⁶ codes.
    apply:
      - setDecision: { decision: code-length, option: "6" }
    expect:
      scenario: s1-create
      fails: [serves-peak, creates-succeed]
      band: not-passing

  - id: seven-characters-one-retry
    base: dynamodb-redis-cache-aside
    description: Seven-character random codes with a single retry fail about 0.2% of creates at 5-year occupancy.
    apply:
      - setDecision: { decision: code-length, option: "7" }
    expect:
      scenario: s1-create
      fails: [creates-succeed]

  - id: decision-contradicts-flow
    base: postgres-redis-cache-aside
    description: The declared strategy is random codes, but the flow uses a key generation service.
    apply:
      - setDecision: { decision: code-strategy, option: random-conditional }
    expect:
      scenario: s1-create
      fails: [code-strategy]

  - id: taken-alias-503
    base: postgres-redis-cache-aside
    description: A taken custom alias answers 503 instead of 409.
    apply:
      - linkOutcome: { operation: create-link, stepId: insert-alias, outcome: conflict, target: c503 }
    expect:
      scenario: s1-create
      fails: [taken-alias-409]

  - id: single-key-generator
    base: postgres-redis-cache-aside
    description: One key generation service instance; creation stops when it does.
    apply:
      - updateComponent: { id: kgs, replicas: 1 }
    expect:
      scenario: s1-create
      fails: [no-single-point-of-failure]

  - id: alias-ignored
    base: postgres-redis-cache-aside
    description: Requests for a custom alias get a generated code instead.
    apply:
      - removeStep: { operation: create-link, stepId: alias, bypass: generated }
    expect:
      scenario: s1-create
      fails: [custom-aliases-supported]
