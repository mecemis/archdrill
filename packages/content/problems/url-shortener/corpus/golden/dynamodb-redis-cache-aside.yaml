id: dynamodb-redis-cache-aside
description: >-
  ALB → Link API (25 × 8 vCPU) → Redis cache-aside (3 shards × 2 replicas)
  → DynamoDB. The cache turns most per-request charges into memory hits; no
  negative caching, so unknown codes still reach the table.
expect:
  s1-create: { minScore: 90 }
  s2-redirect: { minScore: 90 }
  s3-cache: { minScore: 90 }
attempt:
  schemaVersion: 1
  problemId: url-shortener
  problemVersion: 1
  architecture:
    components:
      - { id: visitors, kind: client, flavor: browser, label: Visitors }
      - { id: lb, kind: load-balancer, flavor: alb, label: ALB, size: managed }
      - { id: link-api, kind: service, flavor: generic, label: Link API, size: l, replicas: 25 }
      - { id: redis, kind: cache, flavor: redis, label: Redis, size: m, shards: 3, replicas: 2 }
      - id: links
        kind: key-value-db
        flavor: dynamodb
        label: Links table
        size: on-demand
        data: [{ entity: Link }]
    connections:
      - { id: visitors--lb, from: visitors, to: lb }
      - { id: lb--link-api, from: lb, to: link-api }
      - { id: link-api--redis, from: link-api, to: redis }
      - { id: link-api--links, from: link-api, to: links }
  flows:
    - operation: redirect
      handler: link-api
      root: get
      steps:
        get:
          type: call
          target: redis
          action: cache.get
          entity: Link
          next: { hit: expiry-hit, miss: read, error: read }
        expiry-hit:
          type: logic
          logic: checkExpiry
          next: { valid: r302, expired: r410 }
        read:
          type: call
          target: links
          action: store.read
          entity: Link
          next: { found: expiry-db, notFound: r404, error: r503 }
        expiry-db:
          type: logic
          logic: checkExpiry
          next: { valid: populate, expired: r410 }
        populate:
          type: call
          target: redis
          action: cache.set
          entity: Link
          ttlSec: 3600
          next: { ok: r302, error: r302 }
        r302: { type: respond, status: 302 }
        r404: { type: respond, status: 404 }
        r410: { type: respond, status: 410 }
        r503: { type: respond, status: 503 }
    - operation: create-link
      handler: link-api
      root: validate
      steps:
        validate:
          type: logic
          logic: validateUrl
          next: { valid: alias, invalid: c400 }
        alias:
          type: logic
          logic: hasCustomAlias
          next: { custom: insert-alias, generated: generate }
        insert-alias:
          type: call
          target: links
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: c409, error: c503 }
        generate:
          type: logic
          logic: generateRandomCode
          next: { ok: insert }
        insert:
          type: call
          target: links
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: generate-retry, error: c503 }
        generate-retry:
          type: logic
          logic: generateRandomCode
          next: { ok: insert-retry }
        insert-retry:
          type: call
          target: links
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: c503, error: c503 }
        c201: { type: respond, status: 201 }
        c400: { type: respond, status: 400 }
        c409: { type: respond, status: 409 }
        c503: { type: respond, status: 503 }
  decisions: { code-strategy: random-conditional, code-length: "8" }
  layout:
    visitors: { x: 0, y: 120 }
    lb: { x: 220, y: 120 }
    link-api: { x: 440, y: 120 }
    redis: { x: 680, y: 20 }
    links: { x: 680, y: 220 }
