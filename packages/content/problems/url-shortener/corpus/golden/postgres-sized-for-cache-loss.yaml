# yaml-language-server: $schema=../../../../schema/golden.schema.json
id: postgres-sized-for-cache-loss
title: PostgreSQL sized to survive cache loss
description: >-
  ALB → Link API (33 × 8 vCPU over three zones) → Redis cache-aside (3 shards × 2 replicas,
  20 ms timeout behind a circuit breaker) → PostgreSQL sized to serve the
  full read peak without any cache (16 vCPU, 4 shards × 3 replicas,
  semi-synchronous). Redirects keep working even when the whole cache is
  gone, which is the staff-level answer to S4; the price is a database tier
  that breaks the S3 budget.
expect:
  s1-create: { minScore: 90 }
  s2-redirect: { minScore: 90 }
  s4-cache-outage: { minScore: 90 }
  s6-dependency-failure: { minScore: 90 }
notPassing: [s3-cache]
attempt:
  schemaVersion: 1
  problemId: url-shortener
  problemVersion: 1
  architecture:
    components:
      - { id: visitors, kind: client, flavor: browser, label: Visitors }
      - { id: lb, kind: load-balancer, flavor: alb, label: ALB, size: managed }
      - { id: link-api, kind: service, flavor: generic, label: Link API, size: l, replicas: 33, zones: 3 }
      - { id: redis, kind: cache, flavor: redis, label: Redis, size: m, shards: 3, replicas: 2, zones: 3 }
      - id: links-db
        kind: relational-db
        flavor: postgres
        label: Links DB
        size: l
        shards: 4
        replicas: 3
        zones: 3
        data: [{ entity: Link }]
    connections:
      - { id: visitors--lb, from: visitors, to: lb }
      - { id: lb--link-api, from: lb, to: link-api }
      - id: link-api--redis
        from: link-api
        to: redis
        policy: { timeoutMs: 20, circuitBreaker: true, sameZone: true }
      - id: link-api--links-db
        from: link-api
        to: links-db
        policy: { timeoutMs: 500, sameZone: true }
  flows:
    - operation: redirect
      handler: link-api
      root: get
      steps:
        get:
          type: call
          target: redis
          action: cache.get
          entity: Link
          next: { hit: status-hit, miss: read, error: read }
        status-hit:
          type: logic
          logic: checkStatus
          next: { active: expiry-hit, disabled: r410 }
        expiry-hit:
          type: logic
          logic: checkExpiry
          next: { valid: r302, expired: r410 }
        read:
          type: call
          target: links-db
          action: store.read
          entity: Link
          next: { found: status-db, notFound: r404, error: r503 }
        status-db:
          type: logic
          logic: checkStatus
          next: { active: expiry-db, disabled: r410 }
        expiry-db:
          type: logic
          logic: checkExpiry
          next: { valid: populate, expired: r410 }
        populate:
          type: call
          target: redis
          action: cache.set
          entity: Link
          ttlSec: 3600
          next: { ok: r302, error: r302 }
        r302: { type: respond, status: 302 }
        r404: { type: respond, status: 404 }
        r410: { type: respond, status: 410 }
        r503: { type: respond, status: 503 }
    - operation: create-link
      handler: link-api
      root: validate
      steps:
        validate:
          type: logic
          logic: validateUrl
          next: { valid: alias, invalid: c400 }
        alias:
          type: logic
          logic: hasCustomAlias
          next: { custom: insert-alias, generated: generate }
        insert-alias:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: c409, error: c503 }
        generate:
          type: logic
          logic: generateRandomCode
          next: { ok: insert }
        insert:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: generate-retry, error: c503 }
        generate-retry:
          type: logic
          logic: generateRandomCode
          next: { ok: insert-retry }
        insert-retry:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: c503, error: c503 }
        c201: { type: respond, status: 201 }
        c400: { type: respond, status: 400 }
        c409: { type: respond, status: 409 }
        c503: { type: respond, status: 503 }
    - operation: disable-link
      handler: link-api
      root: update
      steps:
        update:
          type: call
          target: links-db
          action: store.update
          entity: Link
          next: { ok: evict, notFound: d404, error: d503 }
        evict:
          type: call
          target: redis
          action: cache.delete
          entity: Link
          next: { ok: d204, error: d503 }
        d204: { type: respond, status: 204 }
        d404: { type: respond, status: 404 }
        d503: { type: respond, status: 503 }
  decisions:
    code-strategy: random-conditional
    code-length: "8"
    redirect-status: "302"
    replication-mode: semi-sync
  layout:
    visitors: { x: 0, y: 120 }
    lb: { x: 220, y: 120 }
    link-api: { x: 440, y: 120 }
    redis: { x: 700, y: 20 }
    links-db: { x: 700, y: 220 }
