id: postgres-redis-cache-aside
description: >-
  ALB → Redirect API (8 vCPU, 10 to 120 instances) and a gateway → Link API
  (2 vCPU, 2 to 12 instances) → Redis
  cache-aside with negative caching (3 shards × 2 replicas) → PostgreSQL
  (16 vCPU, 2 shards × 2 replicas, semi-synchronous). Redirects run in their own
  service and cap their database calls with a bulkhead, so a cache outage
  cannot take link creation down. A 10-second near cache in the redirect
  service absorbs viral links, both services autoscale between an
  average-day minimum and a spike maximum, and a gateway rate-limits
  creation. Cache calls time out after 20 ms behind a
  circuit breaker; a KGS hands out keys in batches. New links are published
  to a managed queue; a worker scans them with the URL-safety API in batches
  of 100, disables
  and evicts malicious ones, and purges expired links in batches.
expect:
  s5-hot-keys: { minScore: 90 }
  s1-create: { minScore: 90 }
  s2-redirect: { minScore: 90 }
  s3-cache: { minScore: 90 }
  s4-cache-outage: { minScore: 90 }
  s6-dependency-failure: { minScore: 90 }
  s7-edge-cases: { minScore: 90 }
attempt:
  schemaVersion: 1
  problemId: url-shortener
  problemVersion: 1
  architecture:
    components:
      - { id: visitors, kind: client, flavor: browser, label: Visitors }
      - { id: lb, kind: load-balancer, flavor: alb, label: ALB, size: managed }
      - id: redirect-api
        kind: service
        flavor: generic
        label: Redirect API
        size: l
        replicas: 10
        autoscale: { max: 120, targetUtilization: 0.7 }
      - { id: near, kind: near-cache, flavor: in-process-lru, label: Near cache, size: m }
      - id: link-api
        kind: service
        flavor: generic
        label: Link API
        size: s
        replicas: 2
        autoscale: { max: 12, targetUtilization: 0.7 }
      - { id: gateway, kind: api-gateway, flavor: kong, label: Gateway, size: m, replicas: 2 }
      - { id: redis, kind: cache, flavor: redis, label: Redis, size: m, shards: 3, replicas: 2 }
      - id: links-db
        kind: relational-db
        flavor: postgres
        label: Links DB
        size: l
        shards: 2
        replicas: 2
        data: [{ entity: Link }]
      - { id: kgs, kind: id-generator, flavor: kgs, label: KGS, size: m, replicas: 2 }
      - { id: link-events, kind: queue, flavor: managed-queue, label: Link events, size: on-demand }
      - id: worker
        kind: service
        flavor: generic
        label: Worker
        size: s
        replicas: 2
        autoscale: { max: 8, targetUtilization: 0.7 }
      - { id: safety, kind: external-api, flavor: url-safety, label: URL safety, size: quota }
    connections:
      - { id: visitors--lb, from: visitors, to: lb }
      - { id: lb--redirect-api, from: lb, to: redirect-api }
      - { id: lb--gateway, from: lb, to: gateway }
      - { id: gateway--link-api, from: gateway, to: link-api }
      - { id: redirect-api--near, from: redirect-api, to: near }
      - id: redirect-api--redis
        from: redirect-api
        to: redis
        policy: { timeoutMs: 20, circuitBreaker: true }
      - id: redirect-api--links-db
        from: redirect-api
        to: links-db
        policy: { timeoutMs: 200, maxRps: 80000, circuitBreaker: true }
      - id: link-api--links-db
        from: link-api
        to: links-db
        policy: { timeoutMs: 500 }
      - id: link-api--redis
        from: link-api
        to: redis
        policy: { timeoutMs: 20, circuitBreaker: true }
      - id: link-api--kgs
        from: link-api
        to: kgs
        policy: { timeoutMs: 100, retries: 1 }
      - id: link-api--link-events
        from: link-api
        to: link-events
        policy: { timeoutMs: 100, retries: 1 }
      - { id: worker--link-events, from: worker, to: link-events }
      - id: worker--safety
        from: worker
        to: safety
        policy: { timeoutMs: 500 }
      - id: worker--links-db
        from: worker
        to: links-db
        policy: { timeoutMs: 500 }
      - id: worker--redis
        from: worker
        to: redis
        policy: { timeoutMs: 20, circuitBreaker: true }
  flows:
    - operation: redirect
      handler: redirect-api
      root: near-get
      steps:
        near-get:
          type: call
          target: near
          action: cache.get
          entity: Link
          next: { hit: status-hit, miss: get, error: get }
        get:
          type: call
          target: redis
          action: cache.get
          entity: Link
          next: { hit: near-set, negativeHit: r404, miss: read, error: read }
        near-set:
          type: call
          target: near
          action: cache.set
          entity: Link
          ttlSec: 10
          next: { ok: status-hit, error: status-hit }
        status-hit:
          type: logic
          logic: checkStatus
          next: { active: expiry-hit, disabled: r410 }
        expiry-hit:
          type: logic
          logic: checkExpiry
          next: { valid: r302, expired: r410 }
        read:
          type: call
          target: links-db
          action: store.read
          entity: Link
          next: { found: status-db, notFound: negative, error: r503 }
        status-db:
          type: logic
          logic: checkStatus
          next: { active: expiry-db, disabled: r410 }
        expiry-db:
          type: logic
          logic: checkExpiry
          next: { valid: populate, expired: r410 }
        populate:
          type: call
          target: redis
          action: cache.set
          entity: Link
          ttlSec: 3600
          next: { ok: r302, error: r302 }
        negative:
          type: call
          target: redis
          action: cache.setNegative
          entity: Link
          ttlSec: 60
          next: { ok: r404, error: r404 }
        r302: { type: respond, status: 302 }
        r404: { type: respond, status: 404 }
        r410: { type: respond, status: 410 }
        r503: { type: respond, status: 503 }
    - operation: create-link
      handler: link-api
      root: validate
      steps:
        validate:
          type: logic
          logic: validateUrl
          next: { valid: alias, invalid: c400 }
        alias:
          type: logic
          logic: hasCustomAlias
          next: { custom: insert-alias, generated: allocate }
        insert-alias:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: publish, conflict: c409, error: c503 }
        allocate:
          type: call
          target: kgs
          action: ids.allocate
          batchSize: 1000
          next: { ok: insert, error: c503 }
        insert:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: publish, conflict: allocate-retry, error: c503 }
        allocate-retry:
          type: call
          target: kgs
          action: ids.allocate
          batchSize: 1000
          next: { ok: insert-retry, error: c503 }
        insert-retry:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: publish, conflict: c503, error: c503 }
        publish:
          type: call
          target: link-events
          action: queue.publish
          event: link-created
          next: { ok: c201, error: c503 }
        c201: { type: respond, status: 201 }
        c400: { type: respond, status: 400 }
        c409: { type: respond, status: 409 }
        c503: { type: respond, status: 503 }
    - operation: disable-link
      handler: link-api
      root: update
      steps:
        update:
          type: call
          target: links-db
          action: store.update
          entity: Link
          next: { ok: evict, notFound: d404, error: d503 }
        evict:
          type: call
          target: redis
          action: cache.delete
          entity: Link
          next: { ok: d204, error: d503 }
        d204: { type: respond, status: 204 }
        d404: { type: respond, status: 404 }
        d503: { type: respond, status: 503 }
    - operation: scan-link
      handler: worker
      root: check
      steps:
        check:
          type: call
          target: safety
          action: external.check
          batchSize: 100
          next: { clean: s200, malicious: disable, error: s503 }
        disable:
          type: call
          target: links-db
          action: store.update
          entity: Link
          next: { ok: evict, notFound: s200, error: s503 }
        evict:
          type: call
          target: redis
          action: cache.delete
          entity: Link
          next: { ok: s200, error: s503 }
        s200: { type: respond, status: 200 }
        s503: { type: respond, status: 503 }
    - operation: purge-expired
      handler: worker
      root: delete
      steps:
        delete:
          type: call
          target: links-db
          action: store.delete
          entity: Link
          batchSize: 500
          next: { ok: p200, error: p503 }
        p200: { type: respond, status: 200 }
        p503: { type: respond, status: 503 }
  decisions:
    code-strategy: kgs
    redirect-status: "302"
    replication-mode: semi-sync
    expired-status: "410"
    code-reuse: never
  layout:
    visitors: { x: 0, y: 160 }
    lb: { x: 220, y: 160 }
    redirect-api: { x: 440, y: 60 }
    near: { x: 440, y: -80 }
    gateway: { x: 440, y: 280 }
    link-api: { x: 660, y: 460 }
    redis: { x: 700, y: 0 }
    links-db: { x: 700, y: 180 }
    kgs: { x: 940, y: 460 }
    link-events: { x: 940, y: 320 }
    worker: { x: 1160, y: 320 }
    safety: { x: 1380, y: 320 }
