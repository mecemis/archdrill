# yaml-language-server: $schema=../../../../schema/golden.schema.json
id: postgres-redis-two-regions
title: PostgreSQL and Redis in two regions
description: >-
  The PostgreSQL and Redis design, with a standby copy of every component
  in a second region (warm standby). The standby database is an RDS
  cross-region read replica, promoted in about three minutes once the
  primary region is declared lost; the standby Redis is a Global Datastore
  secondary, kept filled. Standby fleets run their autoscaling minimum and
  scale up when clients arrive. Its database has three shards × 2 replicas
  with 20,000 I/Os provisioned on each copy, for the links the cache misses.
  It costs about twice as much, so it is not an answer to the budgets of S3
  and S5.
expect:
  s1-create: { minScore: 90 }
  s2-redirect: { minScore: 90 }
  s4-cache-outage: { minScore: 90 }
  s6-dependency-failure: { minScore: 90 }
  s7-edge-cases: { minScore: 90 }
  s9-region-loss: { minScore: 90 }
notPassing: [s3-cache]
attempt:
  schemaVersion: 1
  problemId: url-shortener
  problemVersion: 1
  architecture:
    components:
      - { id: visitors, kind: client, flavor: browser, label: Visitors }
      - { id: lb, kind: load-balancer, flavor: nginx, label: NGINX, size: m, replicas: 25, zones: 3, regions: 2 }
      - id: redirect-api
        kind: service
        flavor: generic
        label: Redirect API
        regions: 2
        size: l
        replicas: 10
        zones: 3
        autoscale: { max: 120, targetUtilization: 0.6 }
      - { id: near, kind: near-cache, flavor: in-process-lru, label: Near cache, size: m }
      - id: link-api
        kind: service
        flavor: generic
        label: Link API
        regions: 2
        size: s
        replicas: 3
        zones: 3
        autoscale: { max: 12, targetUtilization: 0.6 }
      - { id: gateway, kind: api-gateway, flavor: kong, label: Gateway, size: m, replicas: 2, zones: 2, regions: 2 }
      - { id: redis, kind: cache, flavor: redis, label: Redis, size: m, shards: 3, replicas: 2, zones: 3, regions: 2 }
      - id: links-db
        kind: relational-db
        flavor: postgres
        label: Links DB
        regions: 2
        size: l
        shards: 3
        replicas: 2
        iops: 20000
        zones: 3
        data: [{ entity: Link }]
      - { id: kgs, kind: id-generator, flavor: kgs, label: KGS, size: m, replicas: 2, zones: 2, regions: 2 }
      - { id: link-events, kind: queue, flavor: managed-queue, label: Link events, size: on-demand, regions: 2 }
      - id: worker
        kind: service
        flavor: generic
        label: Worker
        regions: 2
        size: s
        replicas: 3
        zones: 3
        autoscale: { max: 8, targetUtilization: 0.6 }
      - { id: safety, kind: external-api, flavor: url-safety-list, label: URL safety, size: quota }
      - { id: clicks, kind: queue, flavor: kafka, label: Clicks, size: m, replicas: 8, zones: 3, regions: 2 }
      - id: click-counter
        kind: stream-processor
        flavor: flink
        label: Click counter
        regions: 2
        size: m
        replicas: 6
        zones: 3
        autoscale: { max: 16, targetUtilization: 0.6 }
      - id: click-stats
        kind: wide-column-db
        flavor: cassandra
        label: Click stats
        regions: 2
        size: m
        shards: 1
        replicas: 3
        zones: 3
        data: [{ entity: LinkStats }]
    connections:
      - { id: visitors--lb, from: visitors, to: lb }
      - { id: lb--redirect-api, from: lb, to: redirect-api, policy: { sameZone: true } }
      - { id: lb--gateway, from: lb, to: gateway }
      - { id: gateway--link-api, from: gateway, to: link-api }
      - { id: redirect-api--near, from: redirect-api, to: near }
      - id: redirect-api--redis
        from: redirect-api
        to: redis
        policy: { timeoutMs: 20, circuitBreaker: true, sameZone: true }
      - id: redirect-api--links-db
        from: redirect-api
        to: links-db
        policy: { timeoutMs: 200, maxRps: 80000, circuitBreaker: true, sameZone: true }
      - id: link-api--links-db
        from: link-api
        to: links-db
        policy: { timeoutMs: 500 }
      - id: link-api--redis
        from: link-api
        to: redis
        policy: { timeoutMs: 20, circuitBreaker: true }
      - id: link-api--kgs
        from: link-api
        to: kgs
        policy: { timeoutMs: 100, retries: 1 }
      - id: link-api--link-events
        from: link-api
        to: link-events
        policy: { timeoutMs: 100, retries: 1 }
      - { id: worker--link-events, from: worker, to: link-events }
      - id: worker--safety
        from: worker
        to: safety
        policy: { timeoutMs: 500 }
      - id: worker--links-db
        from: worker
        to: links-db
        policy: { timeoutMs: 500 }
      - id: worker--redis
        from: worker
        to: redis
        policy: { timeoutMs: 20, circuitBreaker: true }
      - { id: redirect-api--clicks, from: redirect-api, to: clicks }
      - { id: click-counter--clicks, from: click-counter, to: clicks, policy: { sameZone: true } }
      - id: click-counter--click-stats
        from: click-counter
        to: click-stats
        policy: { timeoutMs: 500, circuitBreaker: true }
  flows:
    - operation: redirect
      handler: redirect-api
      root: near-get
      steps:
        near-get:
          type: call
          target: near
          action: cache.get
          entity: Link
          next: { hit: status-hit, miss: get, error: get }
        get:
          type: call
          target: redis
          action: cache.get
          entity: Link
          next: { hit: near-set, negativeHit: r404, miss: read, error: read }
        near-set:
          type: call
          target: near
          action: cache.set
          entity: Link
          ttlSec: 10
          next: { ok: status-hit, error: status-hit }
        status-hit:
          type: logic
          logic: checkStatus
          next: { active: expiry-hit, disabled: r410 }
        expiry-hit:
          type: logic
          logic: checkExpiry
          next: { valid: click, expired: r410 }
        click:
          type: call
          target: clicks
          action: queue.publish
          event: link-clicked
          fireAndForget: true
          bufferSize: 100000
          batchSize: 100
          next: { ok: r302 }
        read:
          type: call
          target: links-db
          action: store.read
          entity: Link
          next: { found: status-db, notFound: negative, error: r503 }
        status-db:
          type: logic
          logic: checkStatus
          next: { active: expiry-db, disabled: r410 }
        expiry-db:
          type: logic
          logic: checkExpiry
          next: { valid: populate, expired: r410 }
        populate:
          type: call
          target: redis
          action: cache.set
          entity: Link
          ttlSec: 3600
          next: { ok: click, error: click }
        negative:
          type: call
          target: redis
          action: cache.setNegative
          entity: Link
          ttlSec: 60
          next: { ok: r404, error: r404 }
        r302: { type: respond, status: 302 }
        r404: { type: respond, status: 404 }
        r410: { type: respond, status: 410 }
        r503: { type: respond, status: 503 }
    - operation: create-link
      handler: link-api
      root: validate
      steps:
        validate:
          type: logic
          logic: validateUrl
          next: { valid: alias, invalid: c400 }
        alias:
          type: logic
          logic: hasCustomAlias
          next: { custom: insert-alias, generated: allocate }
        insert-alias:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: publish, conflict: c409, error: c503 }
        allocate:
          type: call
          target: kgs
          action: ids.allocate
          batchSize: 1000
          next: { ok: insert, error: c503 }
        insert:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: publish, conflict: allocate-retry, error: c503 }
        allocate-retry:
          type: call
          target: kgs
          action: ids.allocate
          batchSize: 1000
          next: { ok: insert-retry, error: c503 }
        insert-retry:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: publish, conflict: c503, error: c503 }
        publish:
          type: call
          target: link-events
          action: queue.publish
          event: link-created
          outbox: true
          next: { ok: prime }
        prime:
          type: call
          target: redis
          action: cache.set
          entity: Link
          ttlSec: 3600
          next: { ok: c201, error: c201 }
        c201: { type: respond, status: 201 }
        c400: { type: respond, status: 400 }
        c409: { type: respond, status: 409 }
        c503: { type: respond, status: 503 }
    - operation: disable-link
      handler: link-api
      root: update
      steps:
        update:
          type: call
          target: links-db
          action: store.update
          entity: Link
          next: { ok: evict, notFound: d404, error: d503 }
        evict:
          type: call
          target: redis
          action: cache.delete
          entity: Link
          next: { ok: d204, error: d503 }
        d204: { type: respond, status: 204 }
        d404: { type: respond, status: 404 }
        d503: { type: respond, status: 503 }
    - operation: scan-link
      handler: worker
      root: match
      steps:
        match:
          type: logic
          logic: matchThreatList
          next: { clean: s200, match: check }
        check:
          type: call
          target: safety
          action: external.check
          next: { clean: s200, malicious: disable, error: s503 }
        disable:
          type: call
          target: links-db
          action: store.update
          entity: Link
          next: { ok: evict, notFound: s200, error: s503 }
        evict:
          type: call
          target: redis
          action: cache.delete
          entity: Link
          next: { ok: s200, error: s503 }
        s200: { type: respond, status: 200 }
        s503: { type: respond, status: 503 }
    - operation: purge-expired
      handler: worker
      root: delete
      steps:
        delete:
          type: call
          target: links-db
          action: store.delete
          entity: Link
          batchSize: 500
          next: { ok: p200, error: p503 }
        p200: { type: respond, status: 200 }
        p503: { type: respond, status: 503 }
    - operation: record-click
      handler: click-counter
      root: total
      steps:
        total:
          type: call
          target: click-stats
          action: store.insert
          entity: LinkStats
          aggregateSec: 10
          batchSize: 1000
          next: { ok: c200, error: c503 }
        c200: { type: respond, status: 200 }
        c503: { type: respond, status: 503 }
  decisions:
    code-strategy: kgs
    redirect-status: "302"
    replication-mode: semi-sync
    expired-status: "410"
    code-reuse: never
  layout:
    visitors: { x: 0, y: 160 }
    lb: { x: 220, y: 160 }
    redirect-api: { x: 440, y: 60 }
    near: { x: 440, y: -80 }
    gateway: { x: 440, y: 280 }
    link-api: { x: 660, y: 460 }
    redis: { x: 700, y: 0 }
    links-db: { x: 700, y: 180 }
    kgs: { x: 940, y: 460 }
    link-events: { x: 940, y: 320 }
    worker: { x: 1160, y: 320 }
    safety: { x: 1380, y: 320 }
    clicks: { x: 700, y: -200 }
    click-counter: { x: 940, y: -200 }
    click-stats: { x: 1160, y: -200 }
