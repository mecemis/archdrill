id: dynamodb-direct
description: >-
  ALB → stateless Link API (3 replicas) → DynamoDB, no cache. A valid
  alternative for the read path: correct, redundant, and simple. Caching is
  what the next scenario pushes on.
expect:
  s2-redirect: { minScore: 90 }
attempt:
  schemaVersion: 1
  problemId: url-shortener
  problemVersion: 1
  architecture:
    components:
      - { id: visitors, kind: client, flavor: browser, label: Visitors }
      - { id: lb, kind: load-balancer, flavor: alb, label: ALB, size: managed }
      - { id: link-api, kind: service, flavor: generic, label: Link API, size: m, replicas: 3 }
      - id: links
        kind: key-value-db
        flavor: dynamodb
        label: Links table
        size: on-demand
        data: [{ entity: Link }]
    connections:
      - { id: visitors--lb, from: visitors, to: lb }
      - { id: lb--link-api, from: lb, to: link-api }
      - { id: link-api--links, from: link-api, to: links }
  flows:
    - operation: redirect
      handler: link-api
      root: read
      steps:
        read:
          type: call
          target: links
          action: store.read
          entity: Link
          next: { found: expiry, notFound: r404, error: r503 }
        expiry:
          type: logic
          logic: checkExpiry
          next: { valid: r302, expired: r410 }
        r302: { type: respond, status: 302 }
        r404: { type: respond, status: 404 }
        r410: { type: respond, status: 410 }
        r503: { type: respond, status: 503 }
  decisions: {}
  layout:
    visitors: { x: 0, y: 120 }
    lb: { x: 220, y: 120 }
    link-api: { x: 440, y: 120 }
    links: { x: 680, y: 120 }
