id: dynamodb-direct
description: >-
  ALB → stateless Link API (25 × 8 vCPU) → DynamoDB, no cache. A valid
  answer to the read path: correct, redundant and simple. It does not pass
  S3, where paying per request for 300,000 redirects a second breaks the
  budget. With no cache there is nothing to invalidate or lose.
expect:
  s4-cache-outage: { minScore: 90 }
  s6-dependency-failure: { minScore: 90 }
  s1-create: { minScore: 90 }
  s2-redirect: { minScore: 90 }
notPassing: [s3-cache]
attempt:
  schemaVersion: 1
  problemId: url-shortener
  problemVersion: 1
  architecture:
    components:
      - { id: visitors, kind: client, flavor: browser, label: Visitors }
      - { id: lb, kind: load-balancer, flavor: alb, label: ALB, size: managed }
      - { id: link-api, kind: service, flavor: generic, label: Link API, size: l, replicas: 25 }
      - id: links
        kind: key-value-db
        flavor: dynamodb
        label: Links table
        size: on-demand
        data: [{ entity: Link }]
    connections:
      - { id: visitors--lb, from: visitors, to: lb }
      - { id: lb--link-api, from: lb, to: link-api }
      - { id: link-api--links, from: link-api, to: links, policy: { timeoutMs: 500 } }
  flows:
    - operation: redirect
      handler: link-api
      root: read
      steps:
        read:
          type: call
          target: links
          action: store.read
          entity: Link
          next: { found: status, notFound: r404, error: r503 }
        status:
          type: logic
          logic: checkStatus
          next: { active: expiry, disabled: r410 }
        expiry:
          type: logic
          logic: checkExpiry
          next: { valid: r302, expired: r410 }
        r302: { type: respond, status: 302 }
        r404: { type: respond, status: 404 }
        r410: { type: respond, status: 410 }
        r503: { type: respond, status: 503 }
    - operation: create-link
      handler: link-api
      root: validate
      steps:
        validate:
          type: logic
          logic: validateUrl
          next: { valid: alias, invalid: c400 }
        alias:
          type: logic
          logic: hasCustomAlias
          next: { custom: insert-alias, generated: generate }
        insert-alias:
          type: call
          target: links
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: c409, error: c503 }
        generate:
          type: logic
          logic: generateRandomCode
          next: { ok: insert }
        insert:
          type: call
          target: links
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: generate-retry, error: c503 }
        generate-retry:
          type: logic
          logic: generateRandomCode
          next: { ok: insert-retry }
        insert-retry:
          type: call
          target: links
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: generate-retry-2, error: c503 }
        generate-retry-2:
          type: logic
          logic: generateRandomCode
          next: { ok: insert-retry-2 }
        insert-retry-2:
          type: call
          target: links
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: c503, error: c503 }
        c201: { type: respond, status: 201 }
        c400: { type: respond, status: 400 }
        c409: { type: respond, status: 409 }
        c503: { type: respond, status: 503 }
    - operation: disable-link
      handler: link-api
      root: update
      steps:
        update:
          type: call
          target: links
          action: store.update
          entity: Link
          next: { ok: d204, notFound: d404, error: d503 }
        d204: { type: respond, status: 204 }
        d404: { type: respond, status: 404 }
        d503: { type: respond, status: 503 }
  decisions: { code-strategy: random-conditional, redirect-status: "302" }
  layout:
    visitors: { x: 0, y: 120 }
    lb: { x: 220, y: 120 }
    link-api: { x: 440, y: 120 }
    links: { x: 680, y: 120 }
