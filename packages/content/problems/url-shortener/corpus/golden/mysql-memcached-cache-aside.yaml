id: mysql-memcached-cache-aside
description: >-
  NGINX (8 × 4 vCPU) → Link API (25 × 8 vCPU) → Memcached (6 nodes, no replication)
  → MySQL (2 shards × 3 replicas). A cache node that fails only costs its
  share of hits, because cache errors fall through to the database. A day-long
  TTL keeps the hot set cached; expiry is checked on every hit. Losing a Memcached node, or all of them, overloads MySQL (see S4).
expect:
  s6-dependency-failure: { minScore: 90 }
  s1-create: { minScore: 90 }
  s2-redirect: { minScore: 90 }
  s3-cache: { minScore: 90 }
attempt:
  schemaVersion: 1
  problemId: url-shortener
  problemVersion: 1
  architecture:
    components:
      - { id: visitors, kind: client, flavor: browser, label: Visitors }
      - { id: proxy, kind: load-balancer, flavor: nginx, label: NGINX, size: m, replicas: 8 }
      - { id: link-api, kind: service, flavor: generic, label: Link API, size: l, replicas: 25 }
      - { id: memcached, kind: cache, flavor: memcached, label: Memcached, size: m, shards: 6 }
      - id: links-db
        kind: relational-db
        flavor: mysql
        label: Links DB
        size: m
        shards: 2
        replicas: 3
        data: [{ entity: Link }]
      - { id: etcd, kind: coordination, flavor: etcd, label: etcd, size: m, replicas: 3 }
    connections:
      - { id: visitors--proxy, from: visitors, to: proxy }
      - { id: proxy--link-api, from: proxy, to: link-api }
      - { id: link-api--memcached, from: link-api, to: memcached, policy: { timeoutMs: 20, circuitBreaker: true } }
      - { id: link-api--links-db, from: link-api, to: links-db, policy: { timeoutMs: 500 } }
      - { id: link-api--etcd, from: link-api, to: etcd, policy: { timeoutMs: 200 } }
  flows:
    - operation: redirect
      handler: link-api
      root: get
      steps:
        get:
          type: call
          target: memcached
          action: cache.get
          entity: Link
          next: { hit: status-hit, negativeHit: r404, miss: read, error: read }
        status-hit:
          type: logic
          logic: checkStatus
          next: { active: expiry-hit, disabled: r410 }
        expiry-hit:
          type: logic
          logic: checkExpiry
          next: { valid: r302, expired: r410 }
        read:
          type: call
          target: links-db
          action: store.read
          entity: Link
          next: { found: status-db, notFound: negative, error: r503 }
        status-db:
          type: logic
          logic: checkStatus
          next: { active: expiry-db, disabled: r410 }
        expiry-db:
          type: logic
          logic: checkExpiry
          next: { valid: populate, expired: r410 }
        populate:
          type: call
          target: memcached
          action: cache.set
          entity: Link
          ttlSec: 86400
          next: { ok: r302, error: r302 }
        negative:
          type: call
          target: memcached
          action: cache.setNegative
          entity: Link
          ttlSec: 300
          next: { ok: r404, error: r404 }
        r302: { type: respond, status: 302 }
        r404: { type: respond, status: 404 }
        r410: { type: respond, status: 410 }
        r503: { type: respond, status: 503 }
    - operation: create-link
      handler: link-api
      root: validate
      steps:
        validate:
          type: logic
          logic: validateUrl
          next: { valid: alias, invalid: c400 }
        alias:
          type: logic
          logic: hasCustomAlias
          next: { custom: insert-alias, generated: lease }
        insert-alias:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: c409, error: c503 }
        lease:
          type: call
          target: etcd
          action: coord.leaseRange
          batchSize: 10000
          next: { ok: obfuscate, error: c503 }
        obfuscate:
          type: logic
          logic: obfuscateId
          next: { ok: encode }
        encode:
          type: logic
          logic: encodeBase62
          next: { ok: insert }
        insert:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: lease-retry, error: c503 }
        lease-retry:
          type: call
          target: etcd
          action: coord.leaseRange
          batchSize: 10000
          next: { ok: obfuscate-retry, error: c503 }
        obfuscate-retry:
          type: logic
          logic: obfuscateId
          next: { ok: encode-retry }
        encode-retry:
          type: logic
          logic: encodeBase62
          next: { ok: insert-retry }
        insert-retry:
          type: call
          target: links-db
          action: store.insertIfAbsent
          entity: Link
          next: { ok: c201, conflict: c503, error: c503 }
        c201: { type: respond, status: 201 }
        c400: { type: respond, status: 400 }
        c409: { type: respond, status: 409 }
        c503: { type: respond, status: 503 }
    - operation: disable-link
      handler: link-api
      root: update
      steps:
        update:
          type: call
          target: links-db
          action: store.update
          entity: Link
          next: { ok: evict, notFound: d404, error: d503 }
        evict:
          type: call
          target: memcached
          action: cache.delete
          entity: Link
          next: { ok: d204, error: d503 }
        d204: { type: respond, status: 204 }
        d404: { type: respond, status: 404 }
        d503: { type: respond, status: 503 }
  decisions: { code-strategy: counter-range, redirect-status: "302", replication-mode: semi-sync }
  layout:
    visitors: { x: 0, y: 120 }
    proxy: { x: 220, y: 120 }
    link-api: { x: 440, y: 120 }
    memcached: { x: 680, y: 20 }
    links-db: { x: 680, y: 220 }
    etcd: { x: 680, y: 360 }
