# yaml-language-server: $schema=../../../schema/scenario.schema.json
id: s2-groups
problemId: chat
title: Large groups
order: 2
story: |
  "Communities have arrived: groups of 500 people, and one message in fifty
  now goes to one of them. Four hundred members are connected; a hundred are
  not, and about one of those is mentioned in a message. The push provider
  takes 100,000 notifications a second, one for every device."
focusOperations: [send-message, deliver-message]
prerequisites: [s1-deliver]
workload:
  operations:
    send-message:
      entity: Message
      classes:
        - { id: direct, share: 0.73 }
        - { id: direct-offline, share: 0.15, counts: { onlineRecipients: 0, offlineRecipients: 1 } }
        - { id: group, share: 0.1, counts: { onlineRecipients: 8, offlineRecipients: 2 } }
        - id: community
          share: 0.02
          facts: [largeGroup]
          counts: { onlineRecipients: 400, offlineRecipients: 100, mentionedOffline: 1 }
    connect:
      entity: Session
      classes:
        - { id: user, share: 1 }
  keys:
    Session:
      existing: { distribution: zipf, s: 0.6, population: 2.0e7 }
  environments:
    - id: communities
      label: Peak, with large groups
      description: Peak traffic; one message in fifty goes to a group of 500.
      connections: 20000000
      rates: { send-message: 200000, connect: 6000 }
dimensions:
  scalability: 0.5
  latency: 0.5
checks:
  - id: deliveries-keep-up
    use: backlog-stable
    title: Delivery keeps up with large groups
    dimension: scalability
    weight: 2
    severity: major
    requirements: [NFR-1]
    params: { environment: communities }
    why: >-
      A message to 500 people is 500 deliveries. Large groups multiply the
      delivery work tenfold.
    fix: >-
      Scale the delivery consumers for deliveries, not messages, and push to a
      group's members in parallel.

  - id: within-quota
    use: utilization-below
    title: Nothing runs above 85% with large groups, the push provider included
    dimension: scalability
    weight: 3
    severity: major
    requirements: [FR-2]
    params: { environment: communities, max: 0.85 }
    why: >-
      A hundred notifications per community message is 400,000 a second, four
      times the provider's quota, and batching does not help: every device is
      one message. Throttled notifications are lost.
    fix: >-
      Notify a large group's offline members only when they are mentioned;
      the rest see the messages when they open the app. Keep notifying every
      recipient of direct messages and small groups.

  - id: small-conversations-notified
    use: no-path
    title: Direct messages and small groups still notify every offline recipient
    dimension: scalability
    weight: 1
    severity: critical
    requirements: [FR-2]
    params:
      operation: deliver-message
      where:
        all:
          - status: [200]
          - not: { hasStep: { logic: isLargeGroup, outcome: large } }
          - not: { hasStep: { action: external.notify, each: offlineRecipients } }
    why: >-
      Muting large groups is a product choice; muting a direct message means
      someone never learns that a friend wrote.
    fix: >-
      Branch on the group's size: notify every offline recipient of small
      conversations, and only the mentioned ones in large groups.

  - id: delivered-fast-groups
    use: latency-below
    title: Delivery p99 under 2 seconds with large groups
    dimension: latency
    weight: 2
    requirements: [NFR-1]
    params: { operation: deliver-message, environment: communities, percentile: p99, ms: 2000 }
    why: >-
      Pushing to 400 members one after the other takes far longer than in
      parallel.
    fix: >-
      Push to a group's connected members in parallel, in batches per gateway.
hints:
  - "How many deliveries a second do the large groups add, and how many notifications?"
  - "How many notifications a second would a hundred per community message be, if every device counts?"
  - "Push to members in parallel batches, and in large groups notify only the members who are mentioned."
debrief: |
  Questions an interviewer would ask next:

  - Should every member of a 100,000-member channel get a notification for every message? How would you let users choose?
  - A user is mentioned ten times in a minute. How would you collapse those into one notification? (FCM allows a burst of 20 collapsible messages per device, then one every three minutes.)
  - How would you fan out to a group whose members are spread over 100 gateways?
