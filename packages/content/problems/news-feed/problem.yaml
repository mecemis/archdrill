# yaml-language-server: $schema=../../schema/problem.schema.json
id: news-feed
version: 1
title: News Feed
levels: [senior, staff]
brief: |
  People post short updates and follow each other. The home timeline shows
  the newest posts from everyone you follow, 20 at a time, and you can keep
  scrolling back. Most people follow a few hundred accounts and are followed
  by a few hundred; a handful of accounts are followed by tens of millions.
  A new post should show up in followers' timelines within seconds. Posts can
  carry a photo, which followers see with the post.
scale:
  - { label: Daily users, value: "200 million", note: "50 million active in any hour" }
  - { label: Timeline reads, value: "150,000 /s avg, 300,000 /s peak", note: "20 posts a page" }
  - { label: New posts, value: "5,000 /s avg, 10,000 /s peak", note: "about 432 million a day" }
  - { label: Follows, value: "200 followers and 200 followees on average", note: "celebrities: up to 50 million followers" }
  - { label: Photos, value: "1 post in 20 carries one; 200 KB each", note: "a timeline page shows about one; about 8 billion kept" }
requirements:
  - { id: FR-1, kind: functional, text: "Post an update." }
  - { id: FR-2, kind: functional, text: "Read the home timeline: the newest posts from followed accounts, 20 a page, scrolling back without repeated or skipped posts." }
  - { id: NFR-1, kind: non-functional, text: "Timeline p99 < 200 ms; posting p99 < 500 ms." }
  - { id: NFR-2, kind: non-functional, text: "A new post reaches followers' timelines within 5 seconds." }
  - { id: NFR-3, kind: non-functional, text: "Posting stays available (99.9%) even when timelines cannot be served." }
  - { id: FR-3, kind: functional, text: "Attach a photo to a post, and see it with the post in timelines." }
  - { id: NFR-4, kind: non-functional, text: "A photo loads in under 300 ms (p99)." }
  - { id: NFR-5, kind: non-functional, text: "Only signed-in users upload photos, each under the key the service gave them." }
entities:
  - name: Post
    key: postId
    fields: [postId, authorId, text, createdAt]
    avgBytes: 1000
  - name: AuthorPosts
    key: authorId
    fields: [authorId, recentPostIds]
    avgBytes: 1600
  - name: Timeline
    key: userId
    fields: [userId, postIds]
    avgBytes: 6400
    ephemeral: true
  - name: CelebrityPosts
    key: authorId
    fields: [authorId, recentPostIds]
    avgBytes: 1600
    ephemeral: true
    hotFor: followsCelebrity
  - name: Photo
    key: photoId
    fields: [photoId, bytes]
    avgBytes: 200000
# bytes: one request and its response on the wire, HTTP headers included.
operations:
  - id: create-post
    label: Create post
    method: POST
    path: /posts
    bytes: { request: 1200, response: 300 }
    class: write
    idempotent: false
    successStatuses: [201]
    requirements: [FR-1, NFR-1, NFR-3]
    introducedIn: s1-timeline
  - id: read-timeline
    label: Read timeline
    method: GET
    path: /timeline
    # A page of 20 posts is about 20 KB of JSON, compressed about threefold on the wire.
    bytes: { request: 700, response: 6000 }
    class: read
    idempotent: true
    successStatuses: [200]
    requirements: [FR-2, NFR-1]
    introducedIn: s1-timeline
  - id: fan-out-post
    label: Fan out post
    trigger: { type: event, event: post-created }
    class: write
    idempotent: true
    successStatuses: [200]
    requirements: [NFR-2]
    introducedIn: s1-timeline
  # The app asks where to put a photo, puts it there, then creates the post with its key.
  - id: start-upload
    label: Start photo upload
    method: POST
    path: /photos/uploads
    # The answer is a key and an upload URL, signed or not, about a kilobyte.
    bytes: { request: 500, response: 1500 }
    class: read
    idempotent: true
    successStatuses: [200]
    requirements: [FR-3, NFR-5]
    introducedIn: s4-photos
  - id: upload-photo
    label: Upload photo
    method: PUT
    path: /photos/{photoId}
    # A 200 KB photo, resized on the phone before it is sent.
    bytes: { request: 200800, response: 300 }
    class: write
    idempotent: true
    successStatuses: [200]
    requirements: [FR-3, NFR-5]
    introducedIn: s4-photos
  - id: read-photo
    label: Read photo
    method: GET
    path: /photos/{photoId}
    bytes: { request: 600, response: 200500 }
    # A photo never changes once uploaded, and everyone gets the same one.
    cacheableAtEdge: true
    class: read
    idempotent: true
    successStatuses: [200]
    requirements: [FR-3, NFR-4]
    introducedIn: s4-photos
events:
  - { id: post-created, label: Post created, entity: Post }
counts:
  - { id: followers, label: followers of the author, default: 200 }
  - { id: followees, label: accounts the reader follows, default: 200 }
  - { id: celebritiesFollowed, label: celebrities the reader follows, default: 0 }
# A reading session pages through about ten timelines over one connection,
# open for a few minutes and then until the idle timeout closes it.
client: { flavor: browser, label: Visitors, requestsPerConnection: 10, connectionSec: 300 }
logic: [isCelebrity, signUpload]
decisionPoints:
  - id: pagination
    question: How does a client ask for the next page of the timeline?
    options:
      - { id: offset, label: "Offset: skip the first 20, 40, … posts" }
      - { id: cursor, label: "Cursor: posts older than the last one seen" }
    requirements: [FR-2]
estimates:
  - id: posts-per-day
    question: How many posts a day on average?
    kind: count
    answer: 432000000
    derivation: 5,000 posts a second × 86,400 seconds ≈ 432 million posts a day.
  - id: fan-out-writes
    question: Copying every post into each follower's timeline, how many timeline writes a second at peak?
    kind: rate
    answer: 2000000
    derivation: >-
      10,000 posts a second × 200 followers = 2 million timeline writes a
      second, before batching.
  - id: celebrity-fan-out
    question: At a million timeline writes a second, how long does it take to copy one post to 50 million followers?
    kind: count
    answer: 50
    derivation: >-
      50,000,000 ÷ 1,000,000 = 50 seconds for one post, while every other post
      waits. Celebrity posts are better merged in when a follower reads.
  - id: timeline-memory
    question: >-
      A cached timeline keeps 800 post ids of 8 bytes. How much memory holds
      the timelines of 50 million active users?
    kind: bytes
    answer: 320000000000
    derivation: >-
      800 × 8 bytes = 6.4 KB a timeline × 50 million ≈ 320 GB, before cache
      overhead. Inactive users' timelines are rebuilt when they come back.
  - id: pull-reads
    question: If every timeline read fetched the recent posts of 200 followed accounts, how many reads a second at peak?
    kind: rate
    answer: 60000000
    derivation: >-
      300,000 timeline reads × 200 followed accounts = 60 million reads a
      second, which is why timelines are assembled when posts are written.
  - id: photo-bandwidth
    question: A timeline page shows about one 200 KB photo. How many bytes a second do photos take at peak?
    kind: byte-rate
    answer: 60000000000
    derivation: >-
      300,000 pages a second × 200 KB = 60 GB a second, about 480 Gbps: some
      300 servers' worth of network if every photo passed through one.
scenarios: [s1-timeline, s2-celebrities, s3-timelines-lost, s4-photos, s5-viral-photo]
