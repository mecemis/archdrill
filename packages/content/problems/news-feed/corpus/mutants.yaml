# yaml-language-server: $schema=../../../schema/mutants.schema.json
# Each mutant breaks a golden design in one specific way; CI asserts that the
# evaluator catches it.
mutants:
  - id: pull-every-read
    base: hybrid-fan-out
    description: Every timeline read gathers 200 accounts' recent posts; nothing is cached.
    apply:
      - removeStep: { operation: read-timeline, stepId: timeline, bypass: miss }
    expect:
      scenario: s1-timeline
      fails: [timeline-fast]

  - id: posts-not-fanned-out
    base: hybrid-fan-out
    description: Posts are published, but nothing consumes them.
    apply:
      - removeFlow: { operation: fan-out-post }
    expect:
      scenario: s1-timeline
      fails: [posts-reach-timelines]
      band: not-passing

  - id: posts-not-published
    base: hybrid-fan-out
    description: New posts are stored but never published.
    apply:
      - removeStep: { operation: create-post, stepId: publish, bypass: ok }
    expect:
      scenario: s1-timeline
      fails: [posts-reach-timelines]
      band: not-passing

  - id: unbatched-fan-out
    base: hybrid-fan-out
    description: Each follower's timeline is written in its own call.
    apply:
      - updateStep: { operation: fan-out-post, stepId: push, batchSize: null }
    expect:
      scenario: s1-timeline
      fails: [batched-fan-out]

  - id: offset-pagination
    base: hybrid-fan-out
    description: Pages are fetched by offset.
    apply:
      - setDecision: { decision: pagination, option: offset }
    expect:
      scenario: s1-timeline
      fails: [stable-pages]

  - id: small-timeline-cache
    base: hybrid-fan-out
    description: Two cache shards for 50 million timelines.
    apply:
      - updateComponent: { id: redis, shards: 2 }
    expect:
      scenario: s1-timeline
      fails: [timelines-cached]

  - id: celebrities-pushed
    base: hybrid-fan-out
    description: Celebrities' posts are copied to their 50 million followers like everyone else's.
    apply:
      - linkOutcome: { operation: fan-out-post, stepId: who, outcome: celebrity, target: push }
    expect:
      scenario: s2-celebrities
      fails: [fresh-with-celebrities, celebrities-pulled]
      band: not-passing

  - id: celebrities-from-shared-cache
    base: hybrid-fan-out
    description: >-
      Every reader fetches celebrities' posts from the shared cache: 450,000
      lookups a second of 1.6 KB entries, about 5.8 Gbps, from the one shard
      that holds them, whose two nodes send 2.5 Gbps each.
    apply:
      - removeStep: { operation: read-timeline, stepId: celebs-local, bypass: miss }
    expect:
      scenario: s2-celebrities
      fails: [headroom-celebrities]

  - id: timeline-fleet-capped
    base: hybrid-fan-out
    description: >-
      The timeline service may scale to only 20 instances, too few to merge
      celebrities' posts into 300,000 timeline reads a second.
    apply:
      - setAutoscale: { id: timeline-api, autoscale: { max: 20, targetUtilization: 0.7 } }
    expect:
      scenario: s2-celebrities
      fails: [headroom-celebrities]

  - id: unbounded-rebuilds
    base: hybrid-fan-out
    description: Rebuilds are not capped while the cache is down.
    apply:
      - setConnectionPolicy: { id: timeline-api--posts-db, maxRps: null }
    expect:
      scenario: s3-timelines-lost
      fails: [posting-survives]
      band: not-passing

  - id: slow-cache-timeout
    base: hybrid-fan-out
    description: Cache calls wait two seconds before giving up.
    apply:
      - setConnectionPolicy: { id: timeline-api--redis, timeoutMs: 2000 }
    expect:
      scenario: s3-timelines-lost
      fails: [cache-timeout]

  - id: photos-through-timeline-service
    base: hybrid-fan-out
    description: The timeline service reads every photo from S3 and sends it on through the load balancer.
    apply:
      - addConnection: { from: timeline-api, to: photos }
      - removeFlow: { operation: read-photo }
      - createFlow: { operation: read-photo, handler: timeline-api }
      - addStep:
          operation: read-photo
          id: fetch
          step: { type: call, target: photos, action: store.read, entity: Photo }
          attach: { to: root }
      - addStep:
          operation: read-photo
          id: p200
          step: { type: respond, status: 200 }
          attach: { to: outcome, stepId: fetch, outcome: found }
      - addStep:
          operation: read-photo
          id: p404
          step: { type: respond, status: 404 }
          attach: { to: outcome, stepId: fetch, outcome: notFound }
      - addStep:
          operation: read-photo
          id: p503
          step: { type: respond, status: 503 }
          attach: { to: outcome, stepId: fetch, outcome: error }
    expect:
      scenario: s4-photos
      fails: [photos-served, within-budget, headroom-peak, photos-skip-services]
      band: not-passing

  - id: uploads-through-post-service
    base: hybrid-fan-out
    description: The post service takes every upload and writes it to S3 itself.
    apply:
      - removeFlow: { operation: upload-photo }
      - createFlow: { operation: upload-photo, handler: post-api }
      - addStep:
          operation: upload-photo
          id: store
          step: { type: call, target: photos, action: store.insert, entity: Photo }
          attach: { to: root }
      - addStep:
          operation: upload-photo
          id: u200
          step: { type: respond, status: 200 }
          attach: { to: outcome, stepId: store, outcome: ok }
      - addStep:
          operation: upload-photo
          id: u503
          step: { type: respond, status: 503 }
          attach: { to: outcome, stepId: store, outcome: error }
    expect:
      scenario: s4-photos
      fails: [uploads-skip-services]

  - id: unsigned-uploads
    base: hybrid-fan-out
    description: Phones get an upload URL that nobody signed.
    apply:
      - removeStep: { operation: start-upload, stepId: sign, bypass: ok }
    expect:
      scenario: s4-photos
      fails: [uploads-signed]
      band: not-passing

  - id: few-photo-prefixes
    base: hybrid-fan-out
    description: Without a CDN, photos are spread over 16 prefixes.
    apply:
      - removeComponent: { id: photo-cdn }
      - updateComponent: { id: photos, shards: 16 }
    expect:
      scenario: s4-photos
      fails: [photos-served, headroom-peak]
      band: not-passing

  - id: photo-prefixes-at-the-limit
    base: hybrid-fan-out
    description: Without a CDN, photos are spread over 60 prefixes, enough for the peak with no room to spare.
    apply:
      - removeComponent: { id: photo-cdn }
      - updateComponent: { id: photos, shards: 60 }
    expect:
      scenario: s4-photos
      fails: [headroom-peak]

  - id: photos-in-cache-only
    base: hybrid-fan-out
    description: Photos are served from S3, but nothing keeps them there.
    apply:
      - setComponentData: { id: photos, entities: [] }
    expect:
      scenario: s4-photos
      fails: [photos-kept]
      band: not-passing

  - id: photos-without-a-cdn
    base: hybrid-fan-out
    description: Phones fetch every photo straight from S3, the viral one included.
    apply:
      - removeComponent: { id: photo-cdn }
    expect:
      scenario: s5-viral-photo
      fails: [photos-served, viral-headroom, photos-from-the-edge, within-budget]
      band: not-passing

  - id: prefixes-instead-of-a-cdn
    base: hybrid-fan-out
    description: Without a CDN, photos are spread over 256 prefixes to absorb the viral one.
    apply:
      - removeComponent: { id: photo-cdn }
      - updateComponent: { id: photos, shards: 256 }
    expect:
      scenario: s5-viral-photo
      fails: [photos-served, viral-headroom]
      band: not-passing
