# yaml-language-server: $schema=../schema/catalog.schema.json
# Component catalog.
#
# Every number is an order-of-magnitude ballpark for comparing designs, not a
# capacity plan or a price quote. Throughput is per replica (or per node) for
# small requests; latency is server-side processing time; cost is an on-demand
# list-price ballpark per instance-hour (us-east-1, 2026). Storage is priced per
# GB-month for every stored copy.
version: 1
kinds:
  - id: client
    label: Client
    description: Where user traffic comes from.
    capabilities: [traffic-source]
    replicable: false
    holdsData: false
    flavors:
      - id: browser
        label: Browser
        description: Visitors using a web browser.
      - id: mobile-app
        label: Mobile app
        description: Users of a native mobile app.

  - id: load-balancer
    label: Load balancer
    description: Spreads requests across healthy replicas and removes unhealthy ones.
    capabilities: [load-balancing, health-checking]
    replicable: true
    holdsData: false
    flavors:
      - id: alb
        label: Managed LB
        description: Cloud-managed HTTP load balancer, redundant across zones (e.g. AWS ALB, Azure Application Gateway).
        managedRedundancy: true
        sizes:
          managed:
            label: managed
            capacityPerSec: { read: 5000000, write: 5000000 }
            latencyMs: { base: 1, cv: 0.3 }
            costPerHour: 0.03
        defaultSize: managed
        notes: Scales automatically; very sudden extreme spikes may need pre-warming.
      - id: nginx
        label: NGINX
        description: Self-managed reverse proxy and load balancer. Run at least two for redundancy.
        sizes:
          m:
            label: 4 vCPU
            capacityPerSec: { read: 50000, write: 50000 }
            latencyMs: { base: 0.5, cv: 0.3 }
            costPerHour: 0.17
        defaultSize: m

  - id: api-gateway
    label: API gateway
    description: Single entry point that routes requests, authenticates callers and enforces per-client rate limits.
    capabilities: [routing, rate-limiting, authn]
    replicable: true
    holdsData: false
    flavors:
      - id: managed-gateway
        label: Managed API gateway
        description: Cloud-managed gateway (for example Amazon API Gateway or Azure API Management), redundant across zones.
        managedRedundancy: true
        requestCost: { readPerMillion: 1.0, writePerMillion: 1.0 }
        sizes:
          managed:
            label: managed
            capacityPerSec: { read: 1000000, write: 1000000 }
            latencyMs: { base: 5, cv: 0.5 }
            costPerHour: 0
        defaultSize: managed
        notes: Billed per request (about $1 per million for HTTP APIs), which gets expensive on very hot paths; account throttling limits must be raised for high traffic.
      - id: kong
        label: Kong
        description: Self-managed gateway with rate-limiting and authentication plugins. Run at least two.
        sizes:
          m:
            label: 4 vCPU
            capacityPerSec: { read: 20000, write: 20000 }
            latencyMs: { base: 1.5, cv: 0.4 }
            costPerHour: 0.17
        defaultSize: m

  - id: service
    label: Service
    description: Stateless application service that runs request handlers. Scale out with replicas.
    capabilities: [stateless-compute]
    replicable: true
    holdsData: false
    flavors:
      - id: generic
        label: Service
        description: A stateless HTTP service (for example ASP.NET Core, Spring Boot, Go, Node.js).
        startupSec: 60
        sizes:
          s:
            label: 2 vCPU
            capacityPerSec: { read: 4000, write: 2500 }
            latencyMs: { base: 2, cv: 0.5 }
            costPerHour: 0.085
          m:
            label: 4 vCPU
            capacityPerSec: { read: 8000, write: 5000 }
            latencyMs: { base: 2, cv: 0.5 }
            costPerHour: 0.17
          l:
            label: 8 vCPU
            capacityPerSec: { read: 16000, write: 10000 }
            latencyMs: { base: 2, cv: 0.5 }
            costPerHour: 0.34
        defaultSize: m
        notes: Throughput assumes a thin, I/O-bound handler (a lookup and a redirect) on a modern runtime; heavier handlers do far less.

  - id: near-cache
    label: Near cache
    description: In-process cache inside a service. No network hop, but every instance holds its own copy, so it can only be kept fresh with a short TTL.
    capabilities: [volatile-kv, ttl]
    replicable: false
    holdsData: false
    inProcess: true
    flavors:
      - id: in-process-lru
        label: In-process LRU
        description: A bounded LRU map in the service's own memory (for example Caffeine or Guava).
        sizes:
          s:
            label: 256 MB
            memoryGb: 0.25
            latencyMs: { base: 0.02, cv: 0.5 }
            costPerHour: 0
          m:
            label: 1 GB
            memoryGb: 1
            latencyMs: { base: 0.02, cv: 0.5 }
            costPerHour: 0
          l:
            label: 4 GB
            memoryGb: 4
            latencyMs: { base: 0.02, cv: 0.5 }
            costPerHour: 0
        defaultSize: m
        notes: Lives in the memory of the service that connects to it, one copy per instance of that service. A delete reaches one instance only; bound staleness with the TTL.

  - id: cache
    label: Cache
    description: In-memory key-value cache. Fast and volatile; data can disappear at any time.
    capabilities: [volatile-kv, ttl]
    replicable: true
    holdsData: false
    shardable: true
    writeScaling: primaries
    flavors:
      - id: redis
        label: Redis
        description: In-memory data store with rich data types and optional replication.
        sizes:
          s:
            label: 13 GB
            memoryGb: 13
            capacityPerSec: { read: 100000, write: 80000 }
            latencyMs: { base: 0.5, cv: 0.6 }
            costPerHour: 0.22
          m:
            label: 26 GB
            memoryGb: 26
            capacityPerSec: { read: 150000, write: 120000 }
            latencyMs: { base: 0.5, cv: 0.6 }
            costPerHour: 0.44
          l:
            label: 52 GB
            memoryGb: 52
            capacityPerSec: { read: 200000, write: 160000 }
            latencyMs: { base: 0.5, cv: 0.6 }
            costPerHour: 0.87
        defaultSize: m
        notes: Command execution is single-threaded per node. Shards add memory and write capacity; replicas add read capacity and failover. Counts that must survive a restart belong in a durable store, since a restart empties the cache.
      - id: memcached
        label: Memcached
        description: Multi-threaded in-memory cache for simple key-value data. No replication.
        sizes:
          m:
            label: 26 GB
            memoryGb: 26
            capacityPerSec: { read: 300000, write: 250000 }
            latencyMs: { base: 0.5, cv: 0.6 }
            costPerHour: 0.44
        defaultSize: m
        notes: Nodes are independent; use shards for capacity. Memcached has no replication, so replicas only model extra nodes holding the same keys.

  - id: relational-db
    label: Relational database
    description: Durable SQL database with transactions, unique constraints and secondary indexes.
    capabilities: [durable-store, unique-constraint, conditional-write, transactions, secondary-index, range-scan, atomic-increment]
    replicable: true
    holdsData: true
    shardable: true
    writeScaling: primaries
    flavors:
      - id: postgres
        label: PostgreSQL
        description: Open-source relational database. Replicas serve reads and take over on failover.
        storagePricePerGbMonth: 0.115
        sizes:
          s:
            label: 2 vCPU
            capacityPerSec: { read: 5000, write: 1500 }
            latencyMs: { base: 2, cv: 1 }
            costPerHour: 0.18
          m:
            label: 8 vCPU
            capacityPerSec: { read: 20000, write: 5000 }
            latencyMs: { base: 2, cv: 1 }
            costPerHour: 0.7
          l:
            label: 16 vCPU
            capacityPerSec: { read: 40000, write: 10000 }
            latencyMs: { base: 2, cv: 1 }
            costPerHour: 1.4
        defaultSize: m
        notes: Primary-key lookups and single-row inserts on a well-indexed table. Every replica stores a full copy of its shard; storage is priced like managed gp3 volumes.
      - id: mysql
        label: MySQL
        description: Open-source relational database. Replicas serve reads and take over on failover.
        storagePricePerGbMonth: 0.115
        sizes:
          m:
            label: 8 vCPU
            capacityPerSec: { read: 20000, write: 5000 }
            latencyMs: { base: 2, cv: 1 }
            costPerHour: 0.7
        defaultSize: m

  - id: key-value-db
    label: Key-value database
    description: Managed, horizontally partitioned key-value store with conditional writes.
    capabilities: [durable-store, conditional-write, ttl]
    replicable: false
    holdsData: true
    flavors:
      - id: dynamodb
        label: DynamoDB
        description: Managed key-value and document database, replicated across zones.
        managedRedundancy: true
        capabilities: [atomic-increment]
        storagePricePerGbMonth: 0.25
        requestCost: { readPerMillion: 0.125, writePerMillion: 0.625 }
        perKeyCapacityPerSec: { write: 1000 }
        sizes:
          on-demand:
            label: on-demand
            capacityPerSec: { read: 1000000, write: 1000000 }
            latencyMs: { base: 4, cv: 0.5 }
            costPerHour: 0
        defaultSize: on-demand
        notes: On-demand capacity scales with demand once table quotas are raised; you pay per request and per GB stored (one billed copy, replicated across zones). One item lives in one partition, which takes at most 1,000 writes a second, however much capacity the table has.

  - id: wide-column-db
    label: Wide-column database
    description: Durable, partitioned database built for heavy writes, with counters and time-to-live.
    capabilities: [durable-store, atomic-increment, ttl, range-scan]
    replicable: true
    holdsData: true
    shardable: true
    writeScaling: primaries
    flavors:
      - id: cassandra
        label: Cassandra
        description: Leaderless, partitioned database (Apache Cassandra or ScyllaDB). Shards are the groups of nodes that own a range of keys; replicas are the copies of each range.
        storagePricePerGbMonth: 0.1
        sizes:
          m:
            label: 8 vCPU node
            capacityPerSec: { read: 15000, write: 30000 }
            latencyMs: { base: 2, cv: 0.8 }
            costPerHour: 0.6
        defaultSize: m
        notes: Writes are cheap appends, so a node takes about twice as many writes as reads. Run three replicas of every range. Counter columns add in place, so a retried or redelivered increment counts twice.

  - id: id-generator
    label: Id generator
    description: Service that hands out unique keys, for example a key generation service with a pool of pre-generated random codes.
    capabilities: [id-generation]
    replicable: true
    holdsData: false
    flavors:
      - id: kgs
        label: Key generation service
        description: Pre-generates random unique codes into a key table and hands them out, singly or in batches, with an atomic claim.
        sizes:
          m:
            label: 4 vCPU
            capacityPerSec: { read: 20000, write: 20000 }
            latencyMs: { base: 2, cv: 0.5 }
            costPerHour: 0.17
        defaultSize: m
        notes: Every claim marks keys as used in a durable key table. Claiming in batches keeps the service off the per-request path.

  - id: coordination
    label: Coordination service
    description: Strongly consistent store for small coordination data such as leases, counters and leader election.
    capabilities: [consensus, leases]
    replicable: true
    holdsData: false
    writeScaling: primaries
    flavors:
      - id: etcd
        label: etcd
        description: Raft-based key-value store. Run 3 or 5 members.
        sizes:
          m:
            label: 4 vCPU
            capacityPerSec: { read: 40000, write: 10000 }
            latencyMs: { base: 3, cv: 0.6 }
            costPerHour: 0.17
        defaultSize: m
        notes: Every write goes through consensus and costs a quorum round trip, and only the leader takes writes. Keep it off the per-request path.
      - id: zookeeper
        label: ZooKeeper
        description: Consensus-based coordination service (ZAB). Run 3 or 5 servers.
        sizes:
          m:
            label: 4 vCPU
            capacityPerSec: { read: 40000, write: 10000 }
            latencyMs: { base: 3, cv: 0.6 }
            costPerHour: 0.17
        defaultSize: m
        notes: Writes go through the leader and a quorum. Keep it off the per-request path.

  - id: queue
    label: Message queue
    description: Holds messages between the service that publishes them and the workers that consume them. Delivers every message at least once, so a consumer can see one twice.
    capabilities: [async-buffer]
    replicable: true
    holdsData: false
    flavors:
      - id: managed-queue
        label: Managed queue
        description: Cloud-managed queue (for example Amazon SQS or Azure Service Bus), redundant across zones and scaling with demand.
        managedRedundancy: true
        requestCost: { readPerMillion: 0.4, writePerMillion: 0.4 }
        sizes:
          on-demand:
            label: on-demand
            capacityPerSec: { read: 1000000, write: 1000000 }
            latencyMs: { base: 8, cv: 0.5 }
            costPerHour: 0
        defaultSize: on-demand
        notes: You pay per request. Messages wait for days if consumers fall behind; a message that keeps failing is delivered a few times, then moved to a dead-letter queue.
      - id: kafka
        label: Kafka
        description: Partitioned, replicated log on brokers you run (or a managed cluster). Run at least three brokers.
        sizes:
          m:
            label: 4 vCPU broker
            capacityPerSec: { read: 200000, write: 100000 }
            latencyMs: { base: 3, cv: 0.5 }
            costPerHour: 0.4
        defaultSize: m
        notes: Throughput per broker for small messages with replication factor 3. Consumers track their own offsets; at-least-once delivery is the default.

  - id: stream-processor
    label: Stream processor
    description: Consumes a log partition by partition and keeps per-key state in memory, so it can count and sum over windows. It takes messages from a queue, not requests.
    capabilities: [stream-processing]
    replicable: true
    holdsData: false
    flavors:
      - id: flink
        label: Flink
        description: A stream processing job (Apache Flink, or Kafka Streams inside a service) whose per-key state is checkpointed, so a restart resumes where it left off.
        startupSec: 120
        sizes:
          m:
            label: 8 vCPU task manager
            capacityPerSec: { read: 100000, write: 100000 }
            latencyMs: { base: 1, cv: 0.5 }
            costPerHour: 0.4
        defaultSize: m
        notes: Throughput for small messages with simple per-key state, such as counts. A restart replays messages since the last checkpoint, so whatever it writes must tolerate seeing a message twice.

  - id: external-api
    label: External API
    description: A third-party service you call over the internet. You do not control its capacity, latency or uptime.
    capabilities: [external]
    replicable: false
    holdsData: false
    flavors:
      - id: url-safety
        label: URL-safety API
        description: Checks URLs against lists of phishing and malware sites (for example Google Safe Browsing or Web Risk).
        managedRedundancy: true
        sizes:
          quota:
            label: 5,000 requests/s quota
            capacityPerSec: { read: 5000 }
            latencyMs: { base: 50, cv: 0.6 }
            costPerHour: 0
        defaultSize: quota
        notes: The quota is fixed per project; calls above it are rejected (HTTP 429). Each answer takes tens of milliseconds over the internet.
