# yaml-language-server: $schema=../schema/catalog.schema.json
# Component catalog.
#
# Every number says where it came from. A PUBLISHED number (a price, quota or
# spec) cites the vendor source it was read from and when; a MODEL number (how a
# spec becomes simulator behaviour: capacity, latency, startup time) states its
# reasoning and the sources it rests on, or says plainly that it is an
# assumption. Each size names the real offering it stands for.
#
# Throughput is per replica (or per node) for small requests; latency is
# server-side processing time; cost is on-demand per instance-hour in us-east-1.
# Storage is priced per GB-month for every stored copy.
version: 1
kinds:
  - id: client
    label: Client
    description: Where user traffic comes from.
    capabilities: [traffic-source]
    replicable: false
    holdsData: false
    flavors:
      - id: browser
        label: Browser
        description: Visitors using a web browser.
      - id: mobile-app
        label: Mobile app
        description: Users of a native mobile app.
      - id: api-client
        label: API clients
        description: Programs that call a public API with an API key.

  - id: load-balancer
    label: Load balancer
    description: Spreads requests across healthy replicas and removes unhealthy ones.
    capabilities: [load-balancing, health-checking]
    replicable: true
    holdsData: false
    flavors:
      - id: alb
        label: Managed LB
        description: Cloud-managed HTTP load balancer, redundant across zones (e.g. AWS ALB, Azure Application Gateway).
        managedRedundancy: true
        capacityUnits:
          pricePerHour: 0.008
          newConnectionsPerSec: 25
          activeConnections: 3000
          processedGbPerHour: 1
        crossZoneBilling: free
        sizes:
          managed:
            label: managed
            capacityPerSec: { read: 5000000, write: 5000000 }
            latencyMs: { base: 1, cv: 0.3 }
            costPerHour: 0.0225
            provenance:
              costPerHour:
                published: aws-alb-pricing
                note: The hourly charge; capacity units are billed on top.
              capacityPerSec:
                model: Managed balancers scale out on their own and AWS publishes no ceiling, so the figure is set where a managed balancer never limits a design. Very sudden spikes may need pre-warming.
                basis: []
              latencyMs:
                model: About a millisecond of added latency; AWS publishes no figure.
                basis: []
        defaultSize: managed
        notes: >-
          Scales automatically; very sudden extreme spikes may need pre-warming.
          Billed by the hour plus capacity units: one covers 25 new connections a
          second, 3,000 open connections or 1 GB processed an hour, whichever
          needs the most. A client that opens a connection per request costs a
          unit for every 25 requests a second.
        standsFor: AWS Application Load Balancer
        provenance:
          crossZoneBilling:
            published: aws-elb-faqs
            note: Cross-zone load balancing is always on with an Application Load Balancer, and the data it moves between zones is not charged.
          capacityUnits:
            published: aws-alb-pricing
            note: >-
              LCU-hour in US East (N. Virginia), for EC2 and IP targets.
              Rule evaluations, the fourth dimension, are free for the first 10
              rules, more than these designs route with.
      - id: nginx
        label: NGINX
        description: Self-managed reverse proxy and load balancer. Run at least two for redundancy.
        crossZoneBilling: each-end
        sizes:
          m:
            label: 4 vCPU
            capacityPerSec: { read: 50000, write: 50000 }
            latencyMs: { base: 0.5, cv: 0.3 }
            costPerHour: 0.17
            networkGbps: 1.562
            standsFor: c6i.xlarge (EC2, 4 vCPU)
            provenance:
              costPerHour:
                published: ec2-c6i-prices
              networkGbps:
                published: ec2-compute-optimized-network
                note: Baseline; c6i.xlarge bursts to 12.5 Gbps for minutes only.
              capacityPerSec:
                model: NGINX serves about 261,000 requests a second for 1 KB on 4 CPUs as a web server. Proxying costs an upstream connection and TLS per request, so the catalog takes about a fifth of that.
                basis:
                  - nginx-performance
              latencyMs:
                model: Half a millisecond of proxy processing; an assumption.
                basis: []
        defaultSize: m
        provenance:
          crossZoneBilling:
            published: aws-cross-az-data-transfer
            note: EC2 instances pay $0.01 a GB for data they send to, and receive from, another zone.

  - id: api-gateway
    label: API gateway
    description: Single entry point that routes requests, authenticates callers and enforces per-client rate limits.
    capabilities: [routing, rate-limiting, authn]
    replicable: true
    holdsData: false
    flavors:
      - id: managed-gateway
        label: Managed API gateway
        description: Cloud-managed gateway (for example Amazon API Gateway or Azure API Management), redundant across zones.
        managedRedundancy: true
        requestCost: { readPerMillion: 1.0, writePerMillion: 1.0 }
        sizes:
          managed:
            label: managed
            capacityPerSec: { read: 1000000, write: 1000000 }
            latencyMs: { base: 5, cv: 0.5 }
            costPerHour: 0
            provenance:
              costPerHour:
                published: aws-apigw-pricing
                note: "No hourly charge: it is billed per request."
              capacityPerSec:
                model: The account default is 10,000 requests a second per Region; the catalog assumes the quota has been raised for the design's traffic.
                basis:
                  - aws-apigw-quotas
              latencyMs:
                model: A few milliseconds of gateway processing; AWS publishes no figure.
                basis: []
        defaultSize: managed
        notes: Billed per request (about $1 per million for HTTP APIs), which gets expensive on very hot paths; account throttling limits must be raised for high traffic.
        standsFor: Amazon API Gateway (HTTP API)
        provenance:
          requestCost:
            published: aws-apigw-pricing
            note: HTTP APIs, first 300 million requests a month.
      - id: kong
        label: Kong
        description: Self-managed gateway with rate-limiting and authentication plugins. Run at least two.
        crossZoneBilling: each-end
        sizes:
          m:
            label: 4 vCPU
            capacityPerSec: { read: 20000, write: 20000 }
            latencyMs: { base: 1.5, cv: 0.4 }
            costPerHour: 0.17
            networkGbps: 1.562
            standsFor: c6i.xlarge (EC2, 4 vCPU)
            provenance:
              costPerHour:
                published: ec2-c6i-prices
              networkGbps:
                published: ec2-compute-optimized-network
                note: Baseline; c6i.xlarge bursts to 12.5 Gbps for minutes only.
              capacityPerSec:
                model: Kong runs on NGINX; with authentication and rate-limiting plugins it does far less per core than plain proxying. An assumption.
                basis:
                  - nginx-performance
              latencyMs:
                model: A millisecond and a half of plugin processing; an assumption.
                basis: []
        defaultSize: m
        provenance:
          crossZoneBilling:
            published: aws-cross-az-data-transfer
            note: EC2 instances pay $0.01 a GB for data they send to, and receive from, another zone.

  - id: service
    label: Service
    description: Stateless application service that runs request handlers. Scale out with replicas.
    capabilities: [stateless-compute]
    replicable: true
    holdsData: false
    flavors:
      - id: generic
        label: Service
        description: A stateless HTTP service (for example ASP.NET Core, Spring Boot, Go, Node.js).
        startupSec: 60
        crossZoneBilling: each-end
        sizes:
          s:
            label: 2 vCPU
            capacityPerSec: { read: 4000, write: 2500 }
            latencyMs: { base: 2, cv: 0.5 }
            costPerHour: 0.085
            standsFor: c6i.large (EC2, 2 vCPU)
          m:
            label: 4 vCPU
            capacityPerSec: { read: 8000, write: 5000 }
            latencyMs: { base: 2, cv: 0.5 }
            costPerHour: 0.17
            standsFor: c6i.xlarge (EC2, 4 vCPU)
          l:
            label: 8 vCPU
            capacityPerSec: { read: 16000, write: 10000 }
            latencyMs: { base: 2, cv: 0.5 }
            costPerHour: 0.34
            standsFor: c6i.2xlarge (EC2, 8 vCPU)
        defaultSize: m
        notes: Throughput assumes a thin, I/O-bound handler (a lookup and a redirect) on a modern runtime; heavier handlers do far less.
        provenance:
          crossZoneBilling:
            published: aws-cross-az-data-transfer
            note: EC2 instances pay $0.01 a GB for data they send to, and receive from, another zone.
          startupSec:
            model: "A minute from launch to taking traffic: instance boot, runtime start and health checks. An assumption."
            basis: []
          capacityPerSec:
            model: About 2,000 reads a second per vCPU for a thin, I/O-bound handler (a lookup and a redirect) on a modern runtime, and fewer writes. An assumption; heavier handlers do far less.
            basis: []
          latencyMs:
            model: Two milliseconds of handler time for a thin handler; an assumption.
            basis: []
          costPerHour:
            published: ec2-c6i-prices
            note: c6i prices scale linearly with size.

  - id: near-cache
    label: Near cache
    description: In-process cache inside a service. No network hop, but every instance holds its own copy, so it can only be kept fresh with a short TTL.
    capabilities: [volatile-kv, ttl, atomic-increment]
    replicable: false
    holdsData: false
    inProcess: true
    flavors:
      - id: in-process-lru
        label: In-process LRU
        description: A bounded LRU map in the service's own memory (for example Caffeine or Guava).
        sizes:
          s:
            label: 256 MB
            memoryGb: 0.25
            latencyMs: { base: 0.02, cv: 0.5 }
            costPerHour: 0
          m:
            label: 1 GB
            memoryGb: 1
            latencyMs: { base: 0.02, cv: 0.5 }
            costPerHour: 0
          l:
            label: 4 GB
            memoryGb: 4
            latencyMs: { base: 0.02, cv: 0.5 }
            costPerHour: 0
        defaultSize: m
        notes: Lives in the memory of the service that connects to it, one copy per instance of that service. A delete reaches one instance only; bound staleness with the TTL.
        standsFor: A bounded map inside the service (Caffeine, Guava)
        provenance:
          costPerHour:
            model: "No charge of its own: it uses memory of the service it lives in."
            basis: []
          memoryGb:
            model: The size you configure, not a measurement.
            basis: []
          latencyMs:
            model: "An in-process hash-map lookup: tens of microseconds at most, with no network hop."
            basis: []

  - id: cache
    label: Cache
    description: In-memory key-value cache. Fast and volatile; data can disappear at any time.
    capabilities: [volatile-kv, ttl]
    replicable: true
    holdsData: false
    shardable: true
    writeScaling: primaries
    flavors:
      - id: redis
        label: Redis
        description: In-memory data store with rich data types and optional replication.
        capabilities: [atomic-increment]
        crossZoneBilling: other-end
        crossRegionReplication: true
        sizes:
          s:
            label: 13 GB
            memoryGb: 13.07
            capacityPerSec: { read: 110000, write: 110000 }
            latencyMs: { base: 0.35, cv: 0.6 }
            costPerHour: 0.206
            networkGbps: 0.75
            standsFor: cache.r6g.large (ElastiCache, Redis OSS)
            provenance:
              costPerHour:
                published: aws-elasticache-price-list
              memoryGb:
                published: aws-elasticache-price-list
                note: Memory left for data after the node's own reservation.
              networkGbps:
                published: aws-elasticache-node-types
                note: Baseline in each direction; the node bursts to 10 Gbps for minutes at a time.
              capacityPerSec:
                model: AWS measured about 106,000 GETs and as many SETs a second on this node with redis-benchmark's 50 clients, each waiting for its reply before sending again; the replay (calibration "redis-benchmark-r6g-large") reproduces it at 110,000. ElastiCache gives this node type no enhanced I/O, so Redis 7's I/O threads add nothing here.
                basis:
                  - aws-elasticache-r6g-large
                  - redis-benchmarks
                  - aws-elasticache-node-types
          m:
            label: 26 GB
            memoryGb: 26.32
            capacityPerSec: { read: 400000, write: 400000 }
            latencyMs: { base: 0.35, cv: 0.6 }
            costPerHour: 0.411
            networkGbps: 1.25
            standsFor: cache.r6g.xlarge (ElastiCache, Redis OSS)
            provenance:
              costPerHour:
                published: aws-elasticache-price-list
              memoryGb:
                published: aws-elasticache-price-list
                note: Memory left for data after the node's own reservation.
              networkGbps:
                published: aws-elasticache-node-types
                note: Baseline in each direction; the node bursts to 10 Gbps for minutes at a time.
          l:
            label: 52 GB
            memoryGb: 52.82
            capacityPerSec: { read: 600000, write: 600000 }
            latencyMs: { base: 0.35, cv: 0.6 }
            costPerHour: 0.821
            networkGbps: 2.5
            standsFor: cache.r6g.2xlarge (ElastiCache, Redis OSS)
            provenance:
              costPerHour:
                published: elasticache-r6g-2xlarge
              memoryGb:
                published: elasticache-r6g-2xlarge
              networkGbps:
                published: aws-elasticache-node-types
                note: Baseline in each direction; the node bursts to 10 Gbps for minutes at a time.
              capacityPerSec:
                model: Half again the 4-vCPU node's measured 400,000. With eight cores Redis 7.1 moves more of the network work off the command thread; AWS reports up to twice 7.0's throughput on such nodes and over a million commands a second on a 16-vCPU Graviton3 node. An assumption between the two.
                basis:
                  - aws-elasticache-io-multiplexing
                  - aws-elasticache-71
        defaultSize: m
        notes: Commands run on one thread per node, with Redis 7's I/O threads handling the network around it. Shards add memory and write capacity; replicas add read capacity and failover. Atomic increments (INCR with an expiry) suit short-lived counters such as rate limits; counts that must survive a restart belong in a durable store, since a restart empties the cache.
        provenance:
          crossZoneBilling:
            published: aws-elasticache-pricing
            note: No charge for traffic in or out of the ElastiCache node; the instance at the other end pays $0.01 a GB.
          crossRegionReplication:
            published: aws-elasticache-global-datastore
            note: A global datastore replicates the primary cluster to a cluster in another region, asynchronously, and a secondary cluster can be promoted when the primary region fails.
          capacityPerSec:
            model: "AWS measured 395,819 small commands a second (80% GET, 20% SET) on a 4-vCPU node running Redis 7, whose I/O threads take the network work off the command thread; the replay (calibration \"elasticache-redis-7\") reproduces it at 400,000. With 2,000 and 5,200 clients Redis measured 349,000, as so many connections cost it some throughput; the engine holds 392,000, 12% above. GETs and SETs cost the same: redis-benchmark measures them within 1% of each other."
            basis:
              - aws-elasticache-io-multiplexing
              - aws-elasticache-r6g-large
          latencyMs:
            model: "0.35 ms inside the node for a small command, network excluded. With a tenth of a millisecond for a round trip within the zone, it reproduces AWS's median of 0.44 ms at 142,000 commands a second, and the latencies redis-benchmark's 50 clients see."
            basis:
              - aws-elasticache-io-multiplexing
              - aws-elasticache-r6g-large
      - id: memcached
        label: Memcached
        description: Multi-threaded in-memory cache for simple key-value data. No replication.
        crossZoneBilling: other-end
        sizes:
          m:
            label: 26 GB
            memoryGb: 26.32
            capacityPerSec: { read: 400000, write: 400000 }
            latencyMs: { base: 0.35, cv: 0.6 }
            costPerHour: 0.411
            networkGbps: 1.25
            standsFor: cache.r6g.xlarge (ElastiCache, Memcached)
            provenance:
              costPerHour:
                published: aws-elasticache-price-list
                note: Memcached nodes cost the same as Redis OSS nodes.
              memoryGb:
                published: aws-elasticache-price-list
              networkGbps:
                published: aws-elasticache-node-types
                note: Baseline in each direction; the node bursts to 10 Gbps for minutes at a time.
              capacityPerSec:
                model: Memcached spreads commands over a thread per core. Taken equal to Redis 7 on the same node, whose I/O threads do the same for the network work; an assumption.
                basis:
                  - aws-elasticache-io-multiplexing
              latencyMs:
                model: Taken equal to Redis's calibrated 0.35 ms for a small command on the same node; an assumption.
                basis:
                  - aws-elasticache-io-multiplexing
        defaultSize: m
        notes: Nodes are independent; use shards for capacity. Memcached has no replication, so replicas only model extra nodes holding the same keys.
        provenance:
          crossZoneBilling:
            published: aws-elasticache-pricing
            note: No charge for traffic in or out of the ElastiCache node; the instance at the other end pays $0.01 a GB.

  - id: relational-db
    label: Relational database
    description: Durable SQL database with transactions, unique constraints and secondary indexes.
    capabilities: [durable-store, unique-constraint, conditional-write, transactions, secondary-index, range-scan, atomic-increment]
    replicable: true
    holdsData: true
    shardable: true
    writeScaling: primaries
    pooledConnections: true
    flavors:
      - id: postgres
        label: PostgreSQL
        description: Open-source relational database. Replicas serve reads and take over on failover.
        storagePricePerGbMonth: 0.115
        failoverSec: 35
        regionFailoverSec: 180
        crossZoneBilling: other-end
        connectionProxy: { latencyMs: 2, pricePerVcpuHour: 0.015 }
        sizes:
          s:
            label: 2 vCPU
            capacityPerSec: { read: 5000, write: 1500 }
            latencyMs: { base: 2, cv: 1 }
            costPerHour: 0.178
            networkGbps: 0.781
            maxConnections: 831
            vcpus: 2
            standsFor: db.m6i.large (RDS PostgreSQL, 2 vCPU)
            provenance:
              maxConnections:
                model: RDS's default max_connections for PostgreSQL, LEAST({DBInstanceClassMemory/9531392}, 5000), with DBInstanceClassMemory at 92.3% of the class's 8 GiB, the share AWS's own example leaves after the operating system and RDS processes (630 connections instead of 683 on 8 GiB).
                basis:
                  - aws-rds-max-connections
              vcpus:
                published: rds-m6i-prices
                note: db.m6i.large.
              costPerHour:
                published: aws-rds-price-list
                note: Single-AZ.
              networkGbps:
                model: RDS runs on the EC2 instance of the same name, and AWS lists only its burst figure (up to 12.5 Gbps) for RDS; this is m6i.large's baseline in each direction.
                basis:
                  - ec2-general-purpose-network
                  - ec2-network-bandwidth
          m:
            label: 8 vCPU
            capacityPerSec: { read: 20000, write: 5000 }
            latencyMs: { base: 2, cv: 1 }
            costPerHour: 0.712
            networkGbps: 3.125
            maxConnections: 3326
            vcpus: 8
            standsFor: db.m6i.2xlarge (RDS PostgreSQL, 8 vCPU)
            provenance:
              maxConnections:
                model: RDS's default max_connections for PostgreSQL, LEAST({DBInstanceClassMemory/9531392}, 5000), with DBInstanceClassMemory at 92.3% of the class's 32 GiB, the share AWS's own example leaves after the operating system and RDS processes (630 connections instead of 683 on 8 GiB).
                basis:
                  - aws-rds-max-connections
              vcpus:
                published: rds-m6i-prices
                note: db.m6i.2xlarge.
              costPerHour:
                published: rds-m6i-prices
                note: Single-AZ.
              networkGbps:
                model: RDS runs on the EC2 instance of the same name, and AWS lists only its burst figure (up to 12.5 Gbps) for RDS; this is m6i.2xlarge's baseline in each direction.
                basis:
                  - ec2-general-purpose-network
                  - ec2-network-bandwidth
          l:
            label: 16 vCPU
            capacityPerSec: { read: 40000, write: 10000 }
            latencyMs: { base: 2, cv: 1 }
            costPerHour: 1.424
            networkGbps: 6.25
            maxConnections: 5000
            vcpus: 16
            standsFor: db.m6i.4xlarge (RDS PostgreSQL, 16 vCPU)
            provenance:
              maxConnections:
                model: RDS's default max_connections for PostgreSQL, LEAST({DBInstanceClassMemory/9531392}, 5000), with DBInstanceClassMemory at 92.3% of the class's 64 GiB, the share AWS's own example leaves after the operating system and RDS processes (630 connections instead of 683 on 8 GiB).
                basis:
                  - aws-rds-max-connections
              vcpus:
                published: rds-m6i-prices
                note: db.m6i.4xlarge.
              costPerHour:
                published: rds-m6i-prices
                note: Single-AZ.
              networkGbps:
                model: RDS runs on the EC2 instance of the same name, and AWS lists only its burst figure (up to 12.5 Gbps) for RDS; this is m6i.4xlarge's baseline in each direction.
                basis:
                  - ec2-general-purpose-network
                  - ec2-network-bandwidth
        defaultSize: m
        notes: Primary-key lookups and single-row inserts on a well-indexed table. Every replica stores a full copy of its shard; storage is priced like managed gp3 volumes.
        provenance:
          connectionProxy:
            model: 'RDS Proxy: $0.015 an hour per vCPU of the instances behind it, as the Price List API publishes it, and two milliseconds a call, within the "low single-digit milliseconds" AWS says it typically adds.'
            basis:
              - aws-rds-proxy-price
              - aws-rds-proxy-latency
          crossZoneBilling:
            published: aws-rds-pricing
            note: The EC2 end pays $0.01 a GB in and out; data in and out of the RDS instance costs nothing more, and Multi-AZ replication between zones is free.
          storagePricePerGbMonth:
            published: rds-gp3-storage
            note: RDS gp3, Single-AZ, per stored copy.
          regionFailoverSec:
            model: 'Promoting an RDS read replica in the standby region "takes a few minutes to complete and rebooting is part of the process"; taken as three minutes, counted from when the region is declared lost.'
            basis:
              - aws-dr-options
          failoverSec:
            published: rds-multi-az-cluster-failover
            note: Replicas that serve reads and take over by themselves are a Multi-AZ DB cluster's readers. A Multi-AZ DB instance, whose one standby serves no reads, fails over in 60 to 120 seconds.
          capacityPerSec:
            model: pgbench measures about 15,000 in-memory primary-key reads a second per vCPU and about 1,600 TPC-B-like transactions per vCPU. The catalog's reads stand for real queries at six times a pgbench select's work, so it takes a sixth of the read figure (2,500 per vCPU), and about 600 single-row writes per vCPU. Replayed at a sixth of the work (calibration "pgbench-select-only"), the 2-vCPU size reproduces every pgbench run up to 50 clients.
            basis:
              - pgbench-selfhost
          latencyMs:
            model: Two milliseconds for an indexed lookup or a single-row insert on a real query, with a coefficient of variation of 1 for the occasional slow query. A sixth of it, a third of a millisecond, reproduces pgbench's latencies for its lighter selects.
            basis:
              - pgbench-selfhost
      - id: mysql
        label: MySQL
        description: Open-source relational database. Replicas serve reads and take over on failover.
        storagePricePerGbMonth: 0.115
        failoverSec: 35
        regionFailoverSec: 180
        crossZoneBilling: other-end
        connectionProxy: { latencyMs: 2, pricePerVcpuHour: 0.015 }
        sizes:
          m:
            label: 8 vCPU
            capacityPerSec: { read: 20000, write: 5000 }
            latencyMs: { base: 2, cv: 1 }
            costPerHour: 0.712
            networkGbps: 3.125
            maxConnections: 2520
            vcpus: 8
            standsFor: db.m6i.2xlarge (RDS MySQL, 8 vCPU)
            provenance:
              maxConnections:
                model: RDS's default max_connections for MySQL, {DBInstanceClassMemory/12582880}, with DBInstanceClassMemory at 92.3% of the class's 32 GiB, the share AWS's own example leaves after the operating system and RDS processes (630 connections instead of 683 on 8 GiB).
                basis:
                  - aws-rds-max-connections
              vcpus:
                published: rds-m6i-prices
                note: db.m6i.2xlarge.
              networkGbps:
                model: RDS runs on the EC2 instance of the same name, and AWS lists only its burst figure (up to 12.5 Gbps) for RDS; this is m6i.2xlarge's baseline in each direction.
                basis:
                  - ec2-general-purpose-network
                  - ec2-network-bandwidth
              costPerHour:
                model: The published PostgreSQL rate for db.m6i.2xlarge; RDS MySQL lists within a few percent of it.
                basis:
                  - rds-m6i-prices
        defaultSize: m
        provenance:
          connectionProxy:
            model: 'RDS Proxy: $0.015 an hour per vCPU of the instances behind it, as the Price List API publishes it, and two milliseconds a call, within the "low single-digit milliseconds" AWS says it typically adds.'
            basis:
              - aws-rds-proxy-price
              - aws-rds-proxy-latency
          crossZoneBilling:
            published: aws-rds-pricing
            note: The EC2 end pays $0.01 a GB in and out; data in and out of the RDS instance costs nothing more, and Multi-AZ replication between zones is free.
          storagePricePerGbMonth:
            published: rds-gp3-storage
            note: RDS gp3, Single-AZ, per stored copy.
          regionFailoverSec:
            model: 'Promoting an RDS read replica in the standby region "takes a few minutes to complete and rebooting is part of the process"; taken as three minutes, counted from when the region is declared lost.'
            basis:
              - aws-dr-options
          failoverSec:
            published: rds-multi-az-cluster-failover
            note: Replicas that serve reads and take over by themselves are a Multi-AZ DB cluster's readers.
          capacityPerSec:
            model: Taken equal to PostgreSQL on the same hardware for primary-key work; an assumption.
            basis:
              - pgbench-selfhost
          latencyMs:
            model: Two milliseconds for an indexed lookup or a single-row insert; an assumption.
            basis: []

  - id: key-value-db
    label: Key-value database
    description: Managed, horizontally partitioned key-value store with conditional writes.
    capabilities: [durable-store, conditional-write, ttl]
    replicable: false
    holdsData: true
    flavors:
      - id: dynamodb
        label: DynamoDB
        description: Managed key-value and document database, replicated across zones.
        managedRedundancy: true
        capabilities: [atomic-increment]
        storagePricePerGbMonth: 0.25
        requestCost: { readPerMillion: 0.125, writePerMillion: 0.625 }
        requestUnits: { per: item, readBytes: 4096, writeBytes: 1024, readUnits: 0.5 }
        perKeyCapacityPerSec: { write: 1000 }
        crossZoneBilling: free
        sizes:
          on-demand:
            label: on-demand
            capacityPerSec: { read: 1000000, write: 1000000 }
            latencyMs: { base: 4, cv: 0.5 }
            costPerHour: 0
            provenance:
              costPerHour:
                published: aws-dynamodb-pricing
                note: On-demand tables have no hourly charge.
              capacityPerSec:
                model: On-demand tables default to 40,000 read and 40,000 write request units a second; the catalog assumes the quota has been raised for the design's traffic.
                basis:
                  - aws-dynamodb-quotas
              latencyMs:
                model: Single-digit milliseconds inside the service; 4 ms is taken for a point read or write. An assumption.
                basis: []
        defaultSize: on-demand
        notes: On-demand capacity scales with demand once table quotas are raised; you pay per request and per GB stored (one billed copy, replicated across zones). One item lives in one partition, which takes at most 1,000 writes a second, however much capacity the table has.
        standsFor: Amazon DynamoDB (on-demand, Standard table class)
        provenance:
          crossZoneBilling:
            published: aws-data-transfer-overview
            note: Reaching an AWS service at its regional endpoint, through an internet gateway or a gateway endpoint, carries no data transfer charge.
          storagePricePerGbMonth:
            published: aws-dynamodb-pricing
          requestCost:
            published: aws-dynamodb-pricing
            note: "Per million request units: a read unit covers up to 4 KB, a write unit up to 1 KB."
          requestUnits:
            published: aws-dynamodb-read-write
            note: Reads are eventually consistent, the API's default, at half a unit per 4 KB; a strongly consistent read takes a whole one. An update counts the larger of the item's sizes before and after, and a write whose condition fails, or a read of a missing item, still takes its units.
          perKeyCapacityPerSec:
            published: aws-dynamodb-partitions
            note: Every partition delivers at most 3,000 read units and 1,000 write units a second; one item lives in one partition.

  - id: wide-column-db
    label: Wide-column database
    description: Durable, partitioned database built for heavy writes, with counters and time-to-live.
    capabilities: [durable-store, atomic-increment, ttl, range-scan, conditional-write]
    replicable: true
    holdsData: true
    shardable: true
    # Reads and writes at QUORUM, which conditional writes need anyway.
    quorum: true
    writeScaling: primaries
    flavors:
      - id: cassandra
        label: Cassandra
        description: Leaderless, partitioned database (Apache Cassandra or ScyllaDB). Shards are the groups of nodes that own a range of keys; replicas are the copies of each range.
        storagePricePerGbMonth: 0.08
        crossZoneBilling: each-end
        sizes:
          m:
            label: 8 vCPU node
            capacityPerSec: { read: 15000, write: 30000 }
            latencyMs: { base: 2, cv: 0.8 }
            costPerHour: 0.504
            networkGbps: 3.125
            standsFor: r6i.2xlarge (EC2, 8 vCPU, 64 GiB) with gp3 volumes
            provenance:
              costPerHour:
                published: ec2-r6i-2xlarge
              networkGbps:
                published: ec2-memory-optimized-network
                note: Baseline in each direction; the instance bursts to 12.5 Gbps for minutes at a time.
              capacityPerSec:
                model: Instaclustr measured about 45,000 insert-only operations a second on 8-vCPU nodes with cassandra-stress, and advises discounting 20-40% for production. The catalog takes 30,000 writes and half as many reads, since a read may touch several SSTables.
                basis:
                  - instaclustr-cassandra
              latencyMs:
                model: Two milliseconds for a single-partition read or write at a local coordinator; an assumption.
                basis: []
        defaultSize: m
        notes: Writes are cheap appends, so a node takes about twice as many writes as reads. Run three replicas of every range. Counter columns add in place, so a retried or redelivered increment counts twice. Conditional writes (IF NOT EXISTS) run a lightweight transaction, a consensus round between replicas that costs several plain writes.
        provenance:
          crossZoneBilling:
            published: aws-cross-az-data-transfer
            note: EC2 instances pay $0.01 a GB for data they send to, and receive from, another zone.
          storagePricePerGbMonth:
            published: ebs-gp3-storage
            note: EBS gp3 volumes on EC2, per stored copy.

  - id: id-generator
    label: Id generator
    description: Service that hands out unique keys, for example a key generation service with a pool of pre-generated random codes.
    capabilities: [id-generation]
    replicable: true
    holdsData: false
    flavors:
      - id: kgs
        label: Key generation service
        description: Pre-generates random unique codes into a key table and hands them out, singly or in batches, with an atomic claim.
        crossZoneBilling: each-end
        sizes:
          m:
            label: 4 vCPU
            capacityPerSec: { read: 20000, write: 20000 }
            latencyMs: { base: 2, cv: 0.5 }
            costPerHour: 0.17
            standsFor: c6i.xlarge (EC2, 4 vCPU)
            provenance:
              costPerHour:
                published: ec2-c6i-prices
              capacityPerSec:
                model: "A small service claiming keys from a key table: 20,000 claims a second on 4 vCPUs. An assumption."
                basis: []
              latencyMs:
                model: Two milliseconds per claim; an assumption.
                basis: []
        defaultSize: m
        notes: Every claim marks keys as used in a durable key table. Claiming in batches keeps the service off the per-request path.
        provenance:
          crossZoneBilling:
            published: aws-cross-az-data-transfer
            note: EC2 instances pay $0.01 a GB for data they send to, and receive from, another zone.

  - id: coordination
    label: Coordination service
    description: Strongly consistent store for small coordination data such as leases, counters and leader election.
    capabilities: [consensus, leases]
    replicable: true
    holdsData: false
    writeScaling: primaries
    quorum: true
    flavors:
      - id: etcd
        label: etcd
        description: Raft-based key-value store. Run 3 or 5 members.
        crossZoneBilling: each-end
        sizes:
          m:
            label: 4 vCPU
            capacityPerSec: { read: 23000, write: 22000 }
            latencyMs: { base: 1.5, cv: 0.6 }
            costPerHour: 0.17
            standsFor: c6i.xlarge (EC2, 4 vCPU) per member
            provenance:
              costPerHour:
                published: ec2-c6i-prices
              capacityPerSec:
                model: Half the calibrated 8-vCPU member's throughput, taking etcd's work to scale with its cores; an assumption.
                basis:
                  - etcd-performance
              latencyMs:
                model: The 8-vCPU member's calibrated 1.5 ms. A lone write waits on a quorum round and a disk sync, not on cores.
                basis:
                  - etcd-performance
          l:
            label: 8 vCPU
            capacityPerSec: { read: 47000, write: 45000 }
            latencyMs: { base: 1.5, cv: 0.6 }
            costPerHour: 0.34
            standsFor: c6i.2xlarge (EC2, 8 vCPU) per member
            provenance:
              costPerHour:
                published: ec2-c6i-prices
              capacityPerSec:
                model: "etcd's benchmark on three 8-vCPU members: 44,341 writes a second through the leader with 1,000 clients, which the replay (calibration \"etcd-writes\") reproduces at 45,000; and 141,578 linearizable reads spread over the three, about 47,000 each. Only the leader takes writes, so members add read capacity only."
                basis:
                  - etcd-performance
              latencyMs:
                model: "1.5 ms for a write inside the cluster: a quorum round within one zone and a disk sync. With a tenth of a millisecond for the client's round trip it reproduces the benchmark's 1.6 ms for a lone client. The engine gives a component one service time, so reads take a write's 1.5 ms where etcd measures 0.7 ms for a linearizable read."
                basis:
                  - etcd-performance
        defaultSize: m
        notes: Every write goes through consensus and costs a quorum round trip, and only the leader takes writes. Keep it off the per-request path.
        provenance:
          crossZoneBilling:
            published: aws-cross-az-data-transfer
            note: EC2 instances pay $0.01 a GB for data they send to, and receive from, another zone.
      - id: zookeeper
        label: ZooKeeper
        description: Consensus-based coordination service (ZAB). Run 3 or 5 servers.
        crossZoneBilling: each-end
        sizes:
          m:
            label: 4 vCPU
            capacityPerSec: { read: 23000, write: 22000 }
            latencyMs: { base: 1.5, cv: 0.6 }
            costPerHour: 0.17
            standsFor: c6i.xlarge (EC2, 4 vCPU) per server
            provenance:
              costPerHour:
                published: ec2-c6i-prices
              capacityPerSec:
                model: "Taken like etcd's 4-vCPU member: writes go through the leader and a quorum. An assumption."
                basis:
                  - etcd-performance
              latencyMs:
                model: "Taken like etcd: a quorum round within one zone and a disk sync. An assumption."
                basis:
                  - etcd-performance
        defaultSize: m
        notes: Writes go through the leader and a quorum. Keep it off the per-request path.
        provenance:
          crossZoneBilling:
            published: aws-cross-az-data-transfer
            note: EC2 instances pay $0.01 a GB for data they send to, and receive from, another zone.

  - id: queue
    label: Message queue
    description: Holds messages between the service that publishes them and the workers that consume them. Delivers every message at least once, so a consumer can see one twice.
    capabilities: [async-buffer]
    replicable: true
    holdsData: false
    flavors:
      - id: managed-queue
        label: Managed queue
        description: Cloud-managed queue (for example Amazon SQS or Azure Service Bus), redundant across zones and scaling with demand.
        managedRedundancy: true
        requestCost: { readPerMillion: 0.4, writePerMillion: 0.4 }
        requestUnits: { per: request, readBytes: 65536, writeBytes: 65536 }
        crossZoneBilling: free
        sizes:
          on-demand:
            label: on-demand
            capacityPerSec: { read: 1000000, write: 1000000 }
            latencyMs: { base: 8, cv: 0.5 }
            costPerHour: 0
            provenance:
              costPerHour:
                published: aws-sqs-pricing
                note: "No hourly charge: it is billed per request."
              capacityPerSec:
                model: Standard queues support a very high, nearly unlimited number of calls a second per action.
                basis:
                  - aws-sqs-quotas
              latencyMs:
                model: Several milliseconds per send; an assumption.
                basis: []
        defaultSize: on-demand
        notes: You pay per request. Messages wait for days if consumers fall behind; a message that keeps failing is delivered a few times, then moved to a dead-letter queue.
        standsFor: Amazon SQS (standard queue)
        provenance:
          crossZoneBilling:
            published: aws-data-transfer-overview
            note: Reaching an AWS service at its regional endpoint, through an internet gateway or a gateway endpoint, carries no data transfer charge.
          requestCost:
            published: aws-sqs-pricing
            note: Per million requests; each 64 KB of payload counts as one request.
          requestUnits:
            published: aws-sqs-pricing-page
            note: A request carries 1 to 10 messages, up to 1 MiB in all, and each 64 KB of its payload is billed as one request; a batch of small messages is one.
      - id: kafka
        label: Kafka
        description: Partitioned, replicated log on brokers you run (or a managed cluster). Run at least three brokers.
        crossZoneBilling: each-end
        sizes:
          m:
            label: 4 vCPU broker
            capacityPerSec: { read: 200000, write: 100000 }
            latencyMs: { base: 3, cv: 0.5 }
            costPerHour: 0.408
            standsFor: kafka.m7g.xlarge (Amazon MSK, 4 vCPU)
            provenance:
              costPerHour:
                model: Twice the published kafka.m7g.large rate of $0.204 an hour, as MSK broker prices scale with size.
                basis:
                  - aws-msk-pricing
              capacityPerSec:
                model: A partition takes tens of MB a second. For small messages with replication factor 3, a 4-vCPU broker is taken at 100,000 writes and 200,000 reads a second. An assumption.
                basis:
                  - confluent-partitions
              latencyMs:
                model: A few milliseconds to append with acknowledgement from the replicas; an assumption.
                basis: []
        defaultSize: m
        notes: Throughput per broker for small messages with replication factor 3. Consumers track their own offsets; at-least-once delivery is the default.
        provenance:
          crossZoneBilling:
            published: aws-msk-pricing
            note: Standard data transfer charges apply to data in and out of the cluster; replication between brokers is free.

  - id: stream-processor
    label: Stream processor
    description: Consumes a log partition by partition and keeps per-key state in memory, so it can count and sum over windows. It takes messages from a queue, not requests.
    capabilities: [stream-processing]
    replicable: true
    holdsData: false
    flavors:
      - id: flink
        label: Flink
        description: A stream processing job (Apache Flink, or Kafka Streams inside a service) whose per-key state is checkpointed, so a restart resumes where it left off.
        startupSec: 120
        crossZoneBilling: each-end
        sizes:
          m:
            label: 8 vCPU task manager
            capacityPerSec: { read: 100000, write: 100000 }
            latencyMs: { base: 1, cv: 0.5 }
            costPerHour: 0.384
            standsFor: m6i.2xlarge (EC2, 8 vCPU) running a self-managed task manager
            provenance:
              costPerHour:
                published: aws-ec2-price-list
              capacityPerSec:
                model: 100,000 small messages a second with simple per-key state such as counts, on 8 vCPUs. An assumption.
                basis: []
              latencyMs:
                model: A millisecond of processing per message; an assumption.
                basis: []
        defaultSize: m
        notes: Throughput for small messages with simple per-key state, such as counts. A restart replays messages since the last checkpoint, so whatever it writes must tolerate seeing a message twice.
        provenance:
          crossZoneBilling:
            published: aws-cross-az-data-transfer
            note: EC2 instances pay $0.01 a GB for data they send to, and receive from, another zone.
          startupSec:
            model: "Two minutes: the job restarts and restores its state from the last checkpoint. An assumption."
            basis: []

  - id: websocket-gateway
    label: WebSocket gateway
    description: Holds clients' persistent connections and relays frames between them and the services behind it.
    capabilities: [routing, persistent-connections]
    replicable: true
    holdsData: false
    flavors:
      - id: connection-servers
        label: Connection servers
        description: Self-managed servers that keep WebSocket connections open (for example Envoy, or a service on an event loop). Any instance can hold any user's connection.
        startupSec: 60
        crossZoneBilling: each-end
        sizes:
          m:
            label: 8 vCPU, 32 GB
            capacityPerSec: { read: 200000, write: 200000 }
            maxConnections: 250000
            latencyMs: { base: 1, cv: 0.5 }
            costPerHour: 0.384
            standsFor: m6i.2xlarge (EC2, 8 vCPU, 32 GiB)
            provenance:
              costPerHour:
                published: aws-ec2-price-list
              maxConnections:
                model: "Memory decides: about 100 KB of buffers per connection leaves room for about 250,000 in 32 GiB. An assumption."
                basis: []
              capacityPerSec:
                model: 200,000 frames a second relayed on 8 vCPUs; an assumption.
                basis: []
              latencyMs:
                model: A millisecond to relay a frame; an assumption.
                basis: []
        defaultSize: m
        notes: Every open connection holds memory for its buffers, so memory, not CPU, decides how many fit on an instance. A node that goes down drops all of its connections at once, and they all reconnect.
        provenance:
          crossZoneBilling:
            published: aws-cross-az-data-transfer
            note: EC2 instances pay $0.01 a GB for data they send to, and receive from, another zone.
          startupSec:
            model: A minute from launch to holding connections; an assumption.
            basis: []

  - id: external-api
    label: External API
    description: A third-party service you call over the internet. You do not control its capacity, latency or uptime.
    capabilities: [external]
    replicable: false
    holdsData: false
    flavors:
      - id: url-safety
        label: URL-safety API (lookup)
        description: Checks one URL per call against lists of phishing and malware sites (for example Google Web Risk's Lookup API).
        managedRedundancy: true
        requestCost: { readPerMillion: 500, writePerMillion: 500 }
        sizes:
          quota:
            label: 6,000 calls/min (default quota)
            capacityPerSec: { read: 100 }
            latencyMs: { base: 50, cv: 0.6 }
            costPerHour: 0
            provenance:
              capacityPerSec:
                published: web-risk-quotas
                note: 6,000 lookups (uris.search) a minute per project, shared by everything that calls it.
              latencyMs:
                model: Tens of milliseconds over the internet; an assumption.
                basis: []
        defaultSize: quota
        notes: The simplest way to check a URL, and the costliest at volume. Every URL is a call over the internet, billed and counted against a quota of 100 a second; calls above it are rejected (HTTP 429). For many URLs a second, keep a local copy of the lists instead (the local-lists flavor).
        standsFor: Google Web Risk Lookup API (uris.search)
        provenance:
          costPerHour:
            model: Nothing by the hour; every call is billed.
            basis:
              - web-risk-pricing
          requestCost:
            published: web-risk-pricing
            note: $0.50 per 1,000 calls beyond the first 100,000 a month, which are free.
      - id: url-safety-list
        label: URL-safety API (local lists)
        description: Lets a service keep a local copy of the lists of phishing and malware sites and confirms only the URLs that match it (for example Google Web Risk's Update API).
        capabilities: [threat-lists]
        managedRedundancy: true
        requestCost: { readPerMillion: 50000, writePerMillion: 50000 }
        sizes:
          quota:
            label: 6,000 confirmations/min (default quota)
            capacityPerSec: { read: 100 }
            latencyMs: { base: 50, cv: 0.6 }
            costPerHour: 0
            provenance:
              capacityPerSec:
                published: web-risk-quotas
                note: 6,000 confirmations (hashes.search) a minute per project. Downloading list updates has a quota of its own, 600 a minute.
              latencyMs:
                model: Tens of milliseconds over the internet; an assumption.
                basis: []
        defaultSize: quota
        notes: >-
          The service downloads the lists as 4-byte hash prefixes and keeps them
          current every few minutes, for free. It matches each URL against its
          copy first (the step "Match the URL against the local threat lists", no network call)
          and calls here only to confirm a match, so the quota and the price
          apply to matches alone. A confirmation costs a hundred times a lookup:
          the design pays off while matches are rare. Clients may cache a
          verdict for as long as the API says, which the cost here does not
          count. While the API is down the local copy stops updating but keeps
          answering.
        standsFor: Google Web Risk Update API (threatLists.computeDiff, hashes.search)
        provenance:
          costPerHour:
            model: Nothing by the hour, and downloading list updates is free; every confirmation is billed.
            basis:
              - web-risk-pricing
          requestCost:
            published: web-risk-pricing
            note: $50 per 1,000 confirmations (hashes.search). Once a project downloads the lists, its lookups are billed at this price too.
      - id: push-provider
        label: Push notifications
        description: Mobile push services (Apple Push Notification service, Firebase Cloud Messaging) that deliver notifications to devices without an open connection.
        capabilities: [push-notifications]
        managedRedundancy: true
        sizes:
          default:
            label: "600,000 messages/min (default quota)"
            capacityPerSec: { write: 10000 }
            latencyMs: { base: 80, cv: 0.6 }
            costPerHour: 0
            provenance:
              capacityPerSec:
                published: fcm-quotas
                note: 600,000 messages a minute per project, for every device a message goes to.
          quota:
            label: "100,000 messages/s (raised quota)"
            capacityPerSec: { write: 100000 }
            latencyMs: { base: 80, cv: 0.6 }
            costPerHour: 0
            provenance:
              capacityPerSec:
                model: Ten times the default, raised on request. Firebase asks projects that outgrow the default to contact support; the figure is an assumption.
                basis:
                  - fcm-quotas
                  - fcm-scale
        defaultSize: default
        notes: >-
          Every device is one message against the quota. The HTTP v1 API sends
          to one device per request, and the SDK helpers that take up to 500
          devices send one message for each. Calls above the quota are
          rejected (HTTP 429) until the next minute. Delivery is best effort.
        standsFor: Firebase Cloud Messaging (HTTP v1) and Apple Push Notification service
        provenance:
          costPerHour:
            model: Neither provider charges to send notifications.
            basis: []
          latencyMs:
            model: Tens of milliseconds to hand a notification to the provider; an assumption.
            basis: []
      - id: card-payments
        label: Card payments
        description: A payment service provider (for example Stripe or Adyen) that charges and refunds cards and records every payment.
        capabilities: [payments]
        managedRedundancy: true
        sizes:
          default:
            label: "25 requests/s per endpoint (default)"
            capacityPerSec: { read: 25, write: 25 }
            latencyMs: { base: 300, cv: 0.6 }
            costPerHour: 0
            provenance:
              capacityPerSec:
                published: stripe-rate-limits
                note: In live mode, 100 requests a second per account and 25 a second for each endpoint unless noted. Charging and looking up a payment are an endpoint each.
          quota:
            label: "5,000 requests/s (raised by contract)"
            capacityPerSec: { read: 5000, write: 5000 }
            latencyMs: { base: 300, cv: 0.6 }
            costPerHour: 0
            provenance:
              capacityPerSec:
                model: Raised for a high-volume merchant. Stripe raises limits on request, six weeks ahead for a large increase; the figure is an assumption.
                basis:
                  - stripe-rate-limits
        defaultSize: default
        notes: A charge takes a few hundred milliseconds and sometimes times out without saying whether it went through. Idempotency keys make repeats safe; the provider's records are the source of truth for what was charged. Calls above the limit are rejected (HTTP 429).
        standsFor: A payment service provider (Stripe, Adyen)
        provenance:
          costPerHour:
            model: Providers charge a fee per transaction (a percentage of the amount), which the cost model leaves out.
            basis: []
          latencyMs:
            model: A charge takes a few hundred milliseconds; an assumption.
            basis: []
