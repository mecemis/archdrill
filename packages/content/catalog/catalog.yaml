calibrations:
  - id: pgbench-select-only
    title: pgbench select-only on 2 vCPUs
    source: pgbench-selfhost
    component: { kind: relational-db, flavor: postgres, size: s }
    setup: >-
      PostgreSQL 18.4 on a self-managed r6g.large (2 vCPUs, 16 GB), standing
      in for the 2-vCPU RDS size: pgbench -S with prepared statements, from a
      client in another VPC of the same region. Medians of three 60-second
      runs.
    network: region
    reads: 1
    work:
      ratio: 6
      why: >-
        A pgbench select reads one tiny row by primary key with a prepared
        statement. The catalog's reads stand for real queries, taken at six
        times the work: replayed, the size does six times its reads a second,
        each in a sixth of the time.
    beyondModel: >-
      PostgreSQL runs a process per connection. With far more connections than
      cores they contend for locks and CPU, and throughput falls from its peak;
      the engine holds it at the peak. A connection pool keeps a real database
      near the peak.
    runs:
      - { clients: 4, throughput: 5447, latencyMs: 0.73 }
      - { clients: 16, throughput: 18811, latencyMs: 0.85 }
      - { clients: 32, throughput: 29457, latencyMs: 1.09 }
      - { clients: 50, throughput: 28662, latencyMs: 1.74 }
      - { clients: 100, throughput: 21495, latencyMs: 4.65, beyondModel: true }
      - { clients: 200, throughput: 19566, latencyMs: 10.2, beyondModel: true }
  - id: etcd-writes
    title: etcd writes on three 8-vCPU members
    source: etcd-performance
    component: { kind: coordination, flavor: etcd, size: l, replicas: 3 }
    setup: >-
      etcd 3.2.0 on three Google Compute Engine machines with 8 vCPUs, 16 GB
      and an SSD each, written to through the leader from a 16-vCPU client
      machine, presumably in the same zone: 8-byte keys and 256-byte values.
      Current releases are faster.
    network: zone
    reads: 0
    runs:
      - { clients: 1, throughput: 583, latencyMs: 1.6 }
      - { clients: 1000, throughput: 44341, latencyMs: 22 }
  - id: elasticache-redis-7
    title: ElastiCache for Redis 7 on 4 vCPUs
    source: aws-elasticache-io-multiplexing
    component: { kind: cache, flavor: redis, size: m }
    setup: >-
      ElastiCache for Redis 7.0.5 on cache.r6g.xlarge (4 vCPUs) with enhanced
      I/O multiplexing: 80% GET and 20% SET over 3 million 16-byte keys with
      512-byte values, from clients in the same Availability Zone. The
      latency was measured at 142,000 commands a second.
    network: zone
    reads: 0.8
    runs:
      - { clients: 400, throughput: 395819 }
      - { clients: 2000, throughput: 348550 }
      - { clients: 5200, throughput: 349239 }
      - { rate: 142000, p50Ms: 0.44 }
  - id: redis-benchmark-r6g-large
    title: redis-benchmark on 2 vCPUs
    source: aws-elasticache-r6g-large
    component: { kind: cache, flavor: redis, size: s }
    setup: >-
      redis-benchmark with its defaults (50 clients, no pipelining, 3-byte
      values) against ElastiCache on cache.r6g.large, from a c5.2xlarge client
      in the same VPC. GETs are shown; SETs measured 106,610, within 1%. The
      round trips the throughput implies put the client in the same zone.
    network: zone
    reads: 1
    runs:
      - { clients: 50, throughput: 105597 }
